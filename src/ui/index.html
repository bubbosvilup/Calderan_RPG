<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caldrevan</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/client.js" defer></script>
</head>
<body>
  <main>
    <header>
      <div class="brand"><h1>CALDREVAN</h1><span>Playtest</span></div>
      <div class="scene"><span id="location">Caldrevan</span><span id="daypart">—</span></div>
    </header>
    <div class="workspace">
      <div class="story">
        <section id="conversation" role="log" aria-label="Conversation" aria-live="polite" aria-relevant="additions"></section>
        <button id="latest" type="button" hidden>Jump to latest ↓</button>
      </div>
      <aside id="household" aria-label="Household">
        <h2>Household</h2>
        <div id="household-members"><p class="empty-household">No household members yet.</p></div>
      </aside>
    </div>
    <footer>
      <p id="status" role="status">Starting…</p>
      <p id="error" role="alert" hidden></p>
      <form id="composer">
        <label class="sr-only" for="input">What Nicco does or says</label>
        <textarea id="input" rows="2" maxlength="4000" placeholder="Type what Nicco does or says…" disabled></textarea>
        <button id="send" type="submit" disabled>Send</button>
      </form>
      <small>Enter to send · Shift+Enter for a new line</small>
    </footer>
  </main>
</body>
</html>
