  content: The Calderan Woodsigners are a small branch of a much larger Wood Elf clan whose wider
    history is not established. The branch came to Calderan through ducal invitation to contribute
    specialist woodcraft; neither the date nor the inviting Duke is established. Its members are
    relatively few and long-lived. Internally it is comparatively egalitarian, without a rigid
    clan-chief structure. Its specialties are bows, fine woodcraft, weapon stocks, precision wooden
    components, decorative carving and specialist wooden goods, and Woodsigner bows have an
    excellent reputation. Arwen Woodsigner works at The Bent Bough in East.
