    summary: "Restricted: a private Woodsigner cultural tradition about the origin of Beastfolk."
    search_context: Restricted Woodsigner clan tradition
    content: A private cultural tradition preserved by the Woodsigners holds that Beastfolk ultimately
      descend from, or were transformed or mutated from, ancient Elves or Wood Elves. This is an
      inherited clan belief and knowledge claim, not established world truth; it is not public
      knowledge, and nothing in canon confirms or refutes it.
