  content: >-
    House Morvath is one of Calderan's four most powerful founding noble houses and holds a
    hereditary, historic seat on the Ducal Council. It controls or dominates mining concessions,
    major mineral and metal supply, city finance and large-scale lending, military metal
    contracts and the supply of arcane metals and materials, and it is deeply involved in the
    banking of the Center District. Its patriarch is Corvinus Morvath; Iseult Morvath is his younger sister;
    Maelor Morvath is the heir. Exact mine locations, interest rates and banking law are not
    established. House Morvath is not a guild and holds no guild seat, though it may influence
    guilds.
