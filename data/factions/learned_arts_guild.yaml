  summary: >-
    A national guild encompassing learned and professional disciplines in West, including
    magic.
  tags: ["politics"]
  search_context: ""
  content: >-
    The Learned Arts Guild encompasses scholars, scribes, archivists, educated specialists,
    some physicians or apothecaries where appropriate, magical scholarship, and practicing
    mages. Literacy does not imply membership. Magic belongs within this broader learned
    sphere; there is no separate Mages Guild. Rare and powerful practicing mages often have
    considerable influence, but do not automatically rule the guild. Local branches may have
    representatives who collectively determine or select a national representative; selection
    methods remain undefined. Civic magistracy may overlap professionally or socially but is
    not a subordinate guild branch.
