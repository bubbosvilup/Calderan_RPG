  type: "faction"
  name: "Church of the Sun Emperor"
  display_name: "Church of the Sun Emperor"
  parent: null
  aliases: ["the Church", "Church"]
  summary: >-
    The Church of the Sun Emperor is West's authoritarian, hierarchical state church, a
    spiritual-political institution separate from the three national guilds, with comparable or
    greater influence. Its symbol is the Bladed Sun.
  tags: ["politics", "religion"]
  search_context: "Church, Church of the Sun Emperor, Bladed Sun, High Archon of the West, Vicars, Auditors, Zealot Priests, Flagellants, Cathedral of the Bladed Sun, clergy, tithes"
  content: >-
    The Church of the Sun Emperor teaches that the Sun Emperor is West's divine and immortal
    sovereign and the bearer of purifying divine Light. It is not a guild and not one of the three
    civic guilds (Merchants, Artisans, Learned Arts); it is a separate spiritual-political institution with
    comparable or greater influence. Its character is authoritarian, bureaucratic and theocratic:
    ritualized obedience, institutional paranoia, purification doctrine, social control, sacrifice,
    duty and hierarchy. There is no rival pantheon; shrines, chapels and parish temples all belong to
    this Church. Its official symbol is the Bladed Sun, a stylized steel sun whose rays resemble
    blades, associated with Light, authority, purification, war, discipline and threat. Its national
    hierarchy runs from the High Archon of the West through Vicars, Auditors and Zealot Priests to
    Flagellants. The High Archon's seat and the Church's primary headquarters are the Cathedral of
    the Bladed Sun in Calderan's North District; the Church also keeps a liaison office near the
    Ducal Citadel. The High Archon holds spiritual authority and sits on the Ducal Council but does
    not replace the Duke in temporal matters. The Church runs hospitals such as Saint Caldus House,
    the Pyres of the Fallen and charity such as the Sun Soup Kitchens. It gives theological
    justification to slavery. The Inquisition is an organ of the Church. Not every priest is
    sadistic or corrupt; individual clergy may be sincere and compassionate.
