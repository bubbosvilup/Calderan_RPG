chunks:
  - id: "church.hierarchy"
    entity_id: "church"
    section: "hierarchy"
    summary: "The national ranks of the Church of the Sun Emperor, from High Archon to Flagellants."
    search_context: "High Archon of the West, Vicar, Auditor, Zealot Priest, Flagellant, clergy ranks, ecclesiastical hierarchy"
    content: >-
      High Archon of the West: the supreme ecclesiastical authority of West, seated in Calderan
      because it is the capital and institutional center. Speaks for Church authority and sits on
      the Ducal Council; does not command civic administration and does not replace the Duke in
      temporal matters, just as the Duke does not control Church doctrine. Vicars: senior Church
      leaders overseeing major temples, domains or institutional sectors. Auditors: senior
      administrative officials handling properties, tithes, hospitals, records, inspections and
      institutional discipline. Zealot Priests: ordinary local clergy who preach, hear confession,
      conduct funerals, do community religious work, collect tithes and report locally. Flagellants:
      novices and low-ranking religious servants performing menial religious duties, penance and
      ritual service. The current High Archon of the West is Cassian Valerius.
    tags: ["hierarchy"]
  - id: "church.local_sites_and_charity"
    entity_id: "church"
    section: "local_sites_and_charity"
    summary: "Church shrines, chapels and parish temples, and Church charity including the Sun Soup Kitchens."
    search_context: "Shrines of Atonement, saints, martyr chapels, parish temple, tithes, confession, Sun Soup Kitchens, charity, registration of the poor"
    content: >-
      Minor religious sites all belong to the Church: Shrines of Atonement, chapels of saints,
      memorial chapels, martyr cults and local parish temples. Saints and martyrs exist; no
      particular saint is defined here. Local sites collect tithes, hear confession, register
      people, give local charity, refer the sick, coordinate funerals and report suspicious
      behavior. Church charity is materially real and is also propaganda, social control,
      registration, surveillance and a source of legitimacy. The Sun Soup Kitchens feed poor
      people, record indigents, identify illness, distribute doctrine and route people into Church
      institutions. Helping the poor is not forbidden, and individual clergy may genuinely care.
      Clergy endanger themselves when they hide people from records, conceal suspects, falsify
      reports, divert resources without authorization, protect targets from the Church or
      Inquisition, or put compassion above explicit orders.
    tags: ["charity", "surveillance"]
