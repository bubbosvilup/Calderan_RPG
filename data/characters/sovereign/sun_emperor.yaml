  summary: >-
    The Sun Emperor is the sovereign of West in law and doctrine, functionally immortal and, in the
    doctrine of the Church of the Sun Emperor, a divine founder bearing purifying divine Light. He
    disappeared from the world long ago; West is still governed in his name.
  tags: ["sovereign","religion"]
  search_context: "The Sun Emperor, sovereign of West, divine sovereign, immortal emperor, absent emperor, disappeared founder, the Crown, divine Light"
  content: >-
    The Sun Emperor is the lawful sovereign of West and the supreme source of its legitimacy,
    and the realm is still governed in his name. He is functionally immortal. Church doctrine
    proclaims him a divine sovereign, founder and protector of the ordered world, immortal, the
    source or bearer of purifying divine Light and protector of humanity and order against
    corruption and Shadow. He disappeared long ago and has not been publicly seen since; his
    present condition and whereabouts are unknown. Believers variously regard him as hidden,
    withdrawn into divine transcendence or awaiting his return, and the Church does not teach that
    he is dead. He does not live in Calderan, where Duke Uther Calderan governs in his name. His age,
    appearance, personal name, the date and circumstances of his disappearance and his history are
    not established.
