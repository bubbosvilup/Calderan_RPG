chunks:
  - id: sun_emperor.light_secret
    entity_id: sun_emperor
    section: light_secret
    summary: Restricted state and theological secret about the source of the Sun Emperor's divinity and the suppression of Light users.
    search_context: Restricted state secret
    content: >-
      A major state and theological secret known only within the inner Church and the Inquisition:
      the Sun Emperor is a real Light mage, and his functional immortality derives from Light magic.
      The Church publicly frames his Light as divine miracle, never as mortal magic. Independent Light
      users therefore threaten both the Church's theological monopoly and the political legitimacy
      built on it, so the inner Church and the Inquisition capture, silence, torture, mutilate or kill
      them. Ordinary clergy, nobles, scholars, Guard and citizens do not know this. How his immortality
      works, and any specific case or victim, is not established.
    tags: ["secret", "light"]
