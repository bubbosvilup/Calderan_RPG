  summary: Bartolomhew, known as The Redemptor, is a formally respectable licensed slaver specializing
    in Beastfolk and robust laborers at Calderan Slave Market.
  tags:
    - west_npc
  search_context: Bartolomhew The Redemptor licensed slaver, Beastfolk, laborers, miners, workforce,
    Calderan Slave Market.
  content: Bartolomhew deals in enslaved people for mining, dock and warehouse work, agricultural and
    other difficult or industrial labor, including servile guards. Beastfolk and physically robust
    laborers are particular specialties. He has a Back Alley presence as well as formal licensed
    trade and may deal with captives of any age. His manner is warm, courteous and professionally
    calm. His religious background and retained clerical cues do not establish a current clerical
    office.
  knowledge:
    visibility:
      narrator: true
      player: true
    known_by: []
    awareness: local:calderan
  role: npc
  species: Human
  sex: male
  age_band: Around forty
  appearance: Approximately 183–185 cm tall, blond hair extensively turned white, voluntarily retained
    clerical tonsure, pleasant face and paternal easy smile. Warm voice; elegant clothing retains
    clerical cues.
  occupation: Licensed slaver specializing in Beastfolk and labor/workforce categories; The Redemptor
  base_location: calderan_slave_market
  work_location: calderan_slave_market
  home_location: null
  traits:
    - warm and polite exterior
    - paternal easy smile
    - calm professional courtesy
    - profound emotional indifference to captive suffering
    - not gleefully sadistic
    - not rage-driven or theatrically cruel
    - not emotionally excited by suffering
  purpose: Accumulate wealth and influence sufficient to force or engineer his return to the clergy.
    He resents those responsible for his expulsion.
  morality: Treats people as merchandise without meaningful emotional concern for their suffering. He
    need not hate them or enjoy hurting them. Adults, children, families, Beastfolk, workers, sick
    or violent captives and illegally sourced captives receive the same calm inventory-oriented
    consideration. His detachment rests partly on absorbed Church doctrine, which holds that hierarchy
    is divinely ordered, the enslaved hold reduced social and spiritual standing, and a person can be reduced to
    a function within that order. He stays warm and paternal toward free people and is no fanatic.
    Convey detached commodification without graphic description; do not infer murders or a
    serial-killer history.
