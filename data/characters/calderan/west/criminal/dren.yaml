    content: His operational base is an unmarked upper counting room within a Grey Brook warehouse used
      by the Carrion Dogs. No street address, navigable route or separate location entity is
      established. Blackthorn knows the site and his identity and appearance. His group profits from
      trafficking badly injured, sick, dying, desperate, kidnapped or displaced people and families,
      including adults and children as nonsexual victims. He works through intermediaries and does
      not run ordinary public sales. His name circulates in deep criminal circles and rumors, not as
      broadly reliable public identification.
