  purpose: Identify genuine heresy and magical danger through evidence rather than noise.
  morality: A severe institutional inquisitor, not sadistic, who can authorize brutal interrogation
    when doctrine permits it. He dislikes sloppy accusations because false positives waste
    Inquisition time and damage its authority. His blind spot is that he cares far more whether a
    procedure identifies the correct target than whether the procedure itself is humane.
