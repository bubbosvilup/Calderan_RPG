  content: Severan Krauss is a senior field Inquisitor at the Bastion of Vigilance, serving under High
    Inquisitor Helbrecht. He is excellent with records, timelines and contradictions and handles
    much of the documentation, reconstruction and analytic work of investigations. His voice is
    soft, formal and almost courteous; he rarely raises it, and the more certain he becomes that
    someone is lying, the calmer he sounds. He prefers to let people talk until they contradict
    themselves, then repeats their earlier statement back to them almost word for word.
