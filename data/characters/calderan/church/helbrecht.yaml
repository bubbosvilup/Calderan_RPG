  content: "Helbrecht is the High Inquisitor of the West and the Inquisition's national head, working
    from the Bastion of Vigilance. Within the Inquisition he is regarded as an exemplary inquisitor:
    an excellent operational investigator, far less interested in fine bureaucracy and paperwork.
    His deep voice is concise and he does not repeat orders unnecessarily; when suspicious, he often
    watches someone silently for several seconds before speaking. He has no permanent Ducal Council
    seat and attends when summoned on heresy, major arcane threats or Church security."
