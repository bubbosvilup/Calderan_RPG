  private_notes: Has private access to Null Dust, the Mutilating Ritual and the Church's restricted
    account of the Sun Emperor's Light, and enforces the Church's ban on pre-Year-0 records, which he sincerely
    regards as spiritually dangerous; he knows official history is curated but not why or by whom. Understands field investigation, heresy and magical threats
    far better than fine theology or civic paperwork. Considers the City Guard useful but frequently
    too procedural and lenient; no hostility toward any individual Guard officer is established.
