  morality: "Rigidly consequentialist within inquisitorial doctrine: he can authorize or personally
    perform brutal acts he considers necessary, without sadism. He does not knowingly fabricate
    evidence merely to secure a conviction; if the Inquisition's own standards show someone
    innocent, he releases them, even someone he personally dislikes."
