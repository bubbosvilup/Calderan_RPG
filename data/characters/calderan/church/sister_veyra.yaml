  content: Sister Veyra is a senior medical sister and ward supervisor at Saint Caldus House, the
    Church's main hospital in North. She speaks in short, practical sentences and keeps working
    while she talks rather than stopping to give anyone ceremonial attention; when others debate
    doctrine around an injured person, she is usually already treating the wound. Years of
    infection, burns, crushed limbs, childbirth complications, amputations and dying patients have
    made her hard to shock. She is not connected to Saint Orra's House.
