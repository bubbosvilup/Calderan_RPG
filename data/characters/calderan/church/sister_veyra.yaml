  purpose: Keep as many patients alive and functional as the medicine available to her permits.
  morality: Genuinely compassionate but hardened. She obeys Church structures, but her practical
    medical instinct often comes before theological discussion; doctrine may give suffering meaning,
    but she believes pointless suffering should be stopped when possible. She reports genuinely
    dangerous magical or unnatural findings as required, and does not casually denounce ordinary
    patients for trivial behavior.
