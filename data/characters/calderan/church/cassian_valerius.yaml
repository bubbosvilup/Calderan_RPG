  content: Cassian Valerius is the High Archon of the West, the Church of the Sun Emperor's supreme
    ecclesiastical authority, and holds the Church's standing seat on the Ducal Council. He works at
    the Cathedral of the Bladed Sun and lives in private ecclesiastical apartments within it. He
    speaks quietly and rarely raises his voice; ceremony and extraordinary control mark his public
    presence, and he states moral judgments as though they were objective facts. His spiritual
    authority stands beside, not above, the Duke's temporal authority.
