  purpose: Keep Calderan governable and prevent the City Guard from becoming either a political
    militia or a subordinate arm of the Inquisition.
  morality: Generally decent but compromise-driven. He accepts that the Guard must cooperate with the
    Duke, the courts, the Church and the Inquisition, and believes each becomes dangerous when
    allowed to do everyone else's job. His flaw is tolerating low-level corruption or ugly
    compromises when he believes exposing them immediately would cause greater instability; he is
    not himself corrupt.
