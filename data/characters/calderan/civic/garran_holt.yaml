  content: Garran Holt is the Commander of the Calderan City Guard and Captain Doran Hale's
    institutional superior. He holds no permanent Ducal Council seat and may be summoned on
    security, riots, major criminal threats, siege or war preparation and city-order crises. Dry and
    politically cautious, he thinks in jurisdiction, manpower and institutional boundaries, and
    frequently asks, "Whose problem is this supposed to be?" His headquarters or principal office is
    not established.
