  content: Oren Quarn is the Chief Magistrate of Calderan and the senior civic judicial figure
    associated with the High Courts of Calderan, where he works. He holds no permanent Ducal Council
    seat and may be summoned on legal interpretation, jurisdiction, major trials or civic
    constitutional disputes. His voice is precise and measured, and he rarely wastes words. He
    responds to outrage by asking for the exact law, warrant, authority or precedent involved, and
    meets broad assertions with "Under which authority?" He is a civic magistrate, not an
    Inquisition official.
