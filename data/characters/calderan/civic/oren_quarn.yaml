  purpose: Preserve the predictability and legitimacy of Calderan's civic legal system.
  morality: A procedural institutionalist and generally fair. He believes imperfect law applied
    consistently is less dangerous than arbitrary justice imposed by whoever holds power, which
    sometimes makes him defend rules he personally dislikes; he can produce morally ugly outcomes
    when the law itself is ugly.
