  search_context: Vaelen Vael, House Vael patriarch, Chancellor of the Ducal Seal, ducal seals, decrees
  content: Vaelen Vael heads House Vael, Calderan's bureaucratic founding house, and holds its
    standing seat on the Ducal Council. As Chancellor of the Ducal Seal he oversees or strongly
    influences the formal validation of ducal acts, seals, decrees, official appointments and
    high-level correspondence, working in the central administration at the Ducal Citadel; he is not
    omnipotent. His position rests on his noble family, competence, reliability and his personal
    friendship with Duke Uther Calderan. Polite, somewhat monotonous and occasionally
    over-explanatory, he genuinely likes correct procedure, ordered documents and records kept where
    they belong. He is married to Elspeth Vael; Seren Vael is their daughter.
