  content: Corvinus Morvath heads House Morvath and holds its standing seat on the Ducal Council. His
    house dominates mining concessions, metal supply, military metal contracts and large-scale
    lending. Calm and patient, he thinks in dependencies, costs, supply, sustainability and
    long-term consequences, and often reframes emotional arguments as structural or economic
    consequences. Iseult Morvath is his younger sister; Maelor Morvath is the house's heir. He is a
    long-standing friend of Vaelen Vael.
