  content: Uther Calderan is the current Duke of Calderan and the highest temporal authority in the
    city, governing it in the name of the Sun Emperor, to whom he is loyal. Dukes of Calderan take
    Calderan as their dynastic and office surname. His authority covers civic governance,
    administration, taxation, law and military and city policy. He does not control Church doctrine
    and does not replace the High Archon of the West in spiritual matters; conflicts between them
    are political and institutional. He holds the first of the nine seats of the Ducal Council of
    Calderan, and the Ducal Citadel in Center is his residence and seat. Aging and visibly tired, he
    is experienced, worldly and pragmatic, and highly conscious of status and image. No wife,
    children or other family are established.
