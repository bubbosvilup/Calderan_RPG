  content: "Seren Vael works as a junior bureaucratic officer beneath her mother, Elspeth, in the same
    bureaucratic sphere. She takes extensive notes and tends to record before she judges: faced with
    an irregular situation, she first establishes what occurred, who authorized it, which rule
    applies and what needs documenting, and only then weighs its morality. At work she is serious,
    efficient and emotionally restrained."
