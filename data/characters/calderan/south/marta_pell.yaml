  search_context: Marta Pell, innkeeper, proprietor of The Wayfarer's Rest, South District inn
  content: Marta Pell runs The Wayfarer's Rest, a respectable mid-range inn that is neither a luxury
    establishment nor a criminal den. Warm without being naive and loud when she needs to be, she is
    an excellent judge of travelers and knows couriers, caravan staff, guards, mercenaries,
    transport workers and regular travelers. She remembers what regular customers drink and whether
    they pay their bills, and can point a guest toward legitimate services and, discreetly, toward
    adult paid companionship; she runs no brothel.
