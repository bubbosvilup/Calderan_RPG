  content: Halden Cross is an experienced City Guard sergeant assigned to inspections at the Imperial
    Gate. He has seen thousands of travelers, forged stories, merchants, desperate migrants,
    smugglers and nobles' servants, and is good at recognizing when a story does not fit the
    paperwork. He tends to ask one apparently casual question and compare the reply against the
    documents already in front of him. He is notably difficult to bribe.
