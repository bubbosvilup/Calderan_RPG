  purpose: Preserve the clan's reputation and techniques and leave the Iron Hands stronger than he
    inherited them.
  morality: Benevolent but strongly clan-oriented. He often helps people in difficulty, but tends to
    prioritize dwarves when choices are otherwise equal.
