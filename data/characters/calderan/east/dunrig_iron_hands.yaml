  summary: Dunrig Iron Hands is the elder at the head of the Iron Hands, a major dwarven metallurgy
    clan in Calderan's East District, overseeing its workshop network.
  tags:
    - east_npc
    - crafts
    - dwarf
  search_context: Dunrig Iron Hands, Iron Hands elder, dwarven clan head, metallurgy, East District
  content: Dunrig Iron Hands is the senior elder and head figure of the Iron Hands workshop network.
    He no longer performs routine forge work; he oversees master artisans, standards, apprentices,
    quality and the use of the Iron Hands name and techniques. He speaks slowly, in a deep, slightly
    rough voice, concisely and decisively, without needless rudeness or posturing.
