  content: Gaston, who has no surname, is a master clockmaker and precision mechanist with his own
    small workshop in East. He makes clocks, springs, fine gears, precision mechanisms, measuring
    instruments, complex locks and bespoke small mechanisms, including mechanical components used in
    arcane apparatus; he is not a mage. Formerly enslaved, he is now a free man. Patient, affable
    and articulate, with a surprisingly refined vocabulary, he carries himself as a free person,
    though he rarely interrupts and may wait before sitting down in another person's home. The
    workshop's name and exact site are not established.
