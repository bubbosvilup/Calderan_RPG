  private_notes: "Sold into slavery as a child, he spent roughly 35 years in one precision-mechanics
    and watchmaking enterprise, keeping his head down, avoiding serious trouble and obeying his
    owner, and grew into a master clockmaker of extraordinary patience and precision. His elderly
    owner came to trust and respect him considerably, though the relationship remained owner and
    slave. After the owner's death, the owner's son manumitted him in recognition of his decades of
    service. While enslaved he slowly saved a small sum through legitimate or tolerated resale of
    defective pieces, discarded components and workshop scrap; he did not habitually steal useful
    material. Those savings let him open his own workshop. He keeps his original manumission
    document in a fire-resistant box in his workshop, as practical security as much as sentiment:
    documentation is what proves his free legal status. He knows several mages through specialist
    commissioned work and has unusually deep practical knowledge of the mechanical side of arcane
    devices, but no secret magical lore. His former owner, the owner's son and his mage clients are
    not named."
