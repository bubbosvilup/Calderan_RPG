  content: Tavian Merrow holds the Merchants Guild's seat on the Ducal Council of Calderan and works
    from the House of Scales. Sociable, persuasive and energetic, he genuinely enjoys negotiation
    and sees almost every political decision through trade volume, confidence, credit, transport and
    predictable regulation; presented with a political problem, he quickly asks what it will do to
    prices, trade or confidence.
