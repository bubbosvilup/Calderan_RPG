  id: davenport
  type: location
  name: "Davenport"
  display_name: "Davenport"
  parent: west
  aliases: ["The Port of Chains"]
  summary: >-
    Davenport, The Port of Chains, is West's principal port, primary shipbuilding city and main
    maritime gateway, farther south near Chained Bay, famous for its ships and pearls.
  content: >-
    Davenport has an elaborate, wealthy urban presentation, substantial stone docks, and
    major warehouse infrastructure. It is West's primary gateway for legal maritime commerce and
    contains West's largest and most important shipyards, which build civilian, merchant, fishing
    and military vessels and produce the great bulk of West's naval fleet. Its prosperity is also
    deeply tied to legal/institutional slave trade. Calderan and Davenport together hold principal
    institutional monopoly/control over West's legal slave market; detailed law remains undefined.
    Traffic arrives through frontier markets, Ironbound, Khar-Dune-related networks, and other
    legally processed sources, and maritime slave traffic reaching West commonly passes through
    Davenport, legally or illegally. Large storage facilities in its warehouse system form part of
    the logistics chain before auctions or onward transport. Merchant vessels may carry enslaved
    people toward inland plantations, colonies, or other destinations in West's economic sphere.
    Plantations and colonies exist somewhere in that broader system, but their locations, sizes,
    ownership, crops, and political status remain undefined. Davenport is strategically vital: it
    is West's primary maritime gateway, produces much of West's fleet and protects maritime access
    toward the interior, and losing it would severely damage West's naval capacity. Its port areas
    are rougher and more criminal than the wealthy districts; not every district is degraded.
  tags: [geography]
  search_context: "Davenport port city, Port of Chains, West's main harbour, shipyards and shipbuilding, naval fleet, sailors, dockworkers, fishers, pearl divers, Davenport pearls, maritime trade, smuggling, Chained Bay."
