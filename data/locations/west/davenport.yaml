chunks:
  - id: davenport.economy_and_port
    entity_id: davenport
    section: economy_and_port
    summary: Davenport's maritime economy, iconic ships and pearls, imports, exports, trade partners, smuggling, maritime conflicts and port life.
    search_context: Davenport economy, fish and marine food, pearls, marine oils, ships, shipyards, sailors, dockworkers, fishermen, fruit, smuggling, Blackwater, Sandspear, river trade with Calderan, brothels, port crime.
    content: >-
      Davenport's great natural resource is the sea. It produces large quantities of fish and marine
      food, exceptionally fine pearls, rare marine-derived materials and marine oils or substances
      valued by specialist crafts and magic, some taken from unusual sea creatures that are not
      individually established. The mild coastal surroundings grow fruit, and nearby woodland supplies
      ordinary ship timber, not Woodsong timber. Shipbuilding, maritime labour and skilled heavy
      labour are central. Davenport exports fish, marine food, pearls, rare marine materials, marine
      oils, fruit, ships and shipbuilding services, maritime labour, goods passing through its port
      and slaves transported by sea. It imports vegetables and inland farm produce from Calderan's
      wider agricultural region, iron, stone, textiles, spices, specialised finished goods and other
      materials for shipbuilding and city life, including from Calderan and from Center/Zul-Rath
      trade. It trades with Calderan, the wider West, Center ports, Skardgard and East, and other
      maritime partners across Helion. A river reaches the sea at Davenport, and river transport can
      carry cargo inland from Davenport toward the Calderan region; whether that river is Grey Brook's
      lower course, and where cargo is transferred to land, are not established, and boats do not
      enter Calderan through its walls. Most commerce is legal, but smuggling is significant:
      alcohol, contraband, undeclared cargo and trafficked people or illegal slaves, helped by
      Blackwater's proximity and its networks. Smugglers moving illegal captives toward Calderan
      may try routes through Davenport; no single route is established. Davenport has recurring
      maritime tension with Sandspear and Center corsair interests and with Blackwater pirates:
      raids, interceptions and incidents rather than formal total war. Port life is
      hard-working, direct and practical: sailors, dockworkers, shipbuilders, labourers, fishers,
      merchants, smugglers, substantial sex work including legal establishments, and organised crime
      around parts of the port. This describes the port's texture, not the character of every
      resident.
