chunks:
  - id: ironbound.military_economy
    entity_id: ironbound
    section: military_economy
    summary: Ironbound's military-support economy, repair smithing and iron recycling, food and water, dependency on West, vice economy and demographic weakness.
    search_context: Ironbound economy, soldiers, veterans, mercenaries for hire, guards, military smiths, weapon and armour repair, recycled iron, garrison supplies, wells, siege, military discipline, garrison vice.
    content: >-
      Ironbound's economy exists mainly to sustain military life: weapons, armour, repairs and
      equipment maintenance, military supplies, food provisioning, inns and support services,
      military trade, and mercenary or veteran labour. It is known as a place to recruit skilled
      guards, mercenaries, veterans and soldiers for hire. Its many smiths are practical and durable
      repair specialists hardened by military conditions, not elite luxury smiths, and are not
      regarded as Calderan's equals; much iron is reclaimed and recycled from broken weapons, damaged
      armour and battlefield salvage. Natural resources are few: some stone quarries, farmland and
      ordinary local materials, with the wider Dragon's Teeth region near enough for stone and
      materials to matter; no mines lie under the city. Industrial inputs are iron, coal, wood and
      stone; luxury textiles, spices and fashion are of little interest there. Farmers in and around
      Ironbound sell directly to the city and garrison under military protection, so food is
      relatively self-sufficient in normal conditions, while food variety, nonessential goods and
      specialist supplies come from Calderan and Davenport. Ironbound is not on a major river; wells
      and externally supplied water are normally sufficient, water is culturally treated as not to
      be wasted, and prolonged isolation places serious pressure on water and supplies. The city is
      strategically supported by the rest of West, and Calderan and Davenport have a strong national
      interest in keeping it supplied and populated; it would be economically weaker without that
      support. A persistent illegal sex-work economy exists around the garrison: the military
      authority officially suppresses it as damaging to discipline, but soldiers create demand, some
      local guards tolerate it and enforcement is inconsistent. Its main long-term vulnerability is
      demographic: few stable civilian families relative to the military presence, low natural
      replacement and dependence on new soldiers, recruits and support from wider West; without
      continual reinforcement it would gradually shrink.
    tags:
      - economy
      - military
