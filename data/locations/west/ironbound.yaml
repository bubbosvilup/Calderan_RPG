entity:
  id: ironbound
  type: location
  name: "Ironbound"
  display_name: "Ironbound"
  parent: west
  aliases: ["The Fortress on the Edge"]
  summary: >-
    Ironbound is a small fortified military city east of Calderan at the principal West–Center land
    passage, on West's side of the border, governed by a military authority.
  content: >-
    Ironbound grew from military encampments, permanent garrisoning, defensive construction and
    support infrastructure into a walled fortress-city. Its defensive and administrative role makes
    it more than a settlement near the frontier. Its massive fortress-gate character and heavy
    stone-and-iron fortifications block armed incursions and desert raids, bearing physical evidence
    of repeated violent border clashes. It is a major military filtering point with important
    customs and border-control functions, high political tension, and frequent contact with the
    consequences of skirmishes. Unlike ordinary ducal cities, it is governed by a military authority
    led by a general; the general's identity is not established, and the current leadership is
    strict and disciplinarian. Official enforcement and unofficial corruption coexist. Authorities
    may ignore, facilitate, or inadequately investigate slave caravans originating in raids and
    cross-border violence. Not every guard is corrupt, and not all slave traffic through Ironbound
    is legal. Its population is disproportionately soldiers, military support personnel, veterans,
    smiths and merchants serving troops; civilians, farmers and families also live there, but it is
    not a large ordinary civilian city. It belongs to West rather than being an independent nation
    or autonomous city-state.
  tags: [geography]
  search_context: "Ironbound fortress city, West–Center frontier, border garrison, soldiers, veterans, mercenaries and guards for hire, military smiths, armour repair, customs, frontier smuggling."
