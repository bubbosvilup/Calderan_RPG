      description: "Massive fortress-gate character, heavy stone-and-iron defenses, and visible damage from repeated clashes."
    - name: "military and customs filtering point"
      description: "Defensive and administrative border control on West's side of the frontier; official enforcement coexists with unofficial corruption."
