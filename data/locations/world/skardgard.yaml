  summary: >-
    Skardgard is East's principal coastal city, farther southeast, with strong natural
    defenses and a maritime economy.
  content: >-
    Difficult fjord-like coastal geography, dark stone fortifications, persistent ice
    conditions, and isolation make Skardgard extremely difficult to assault by sea, not
    literally impossible to conquer. Its economic and population associations include
    whalers, shipbuilders, experienced sailors, high-seas fishing, maritime trade, and
    extraction or trade of rare resources from ice-bound regions. The rare resources are not
    individually specified. Exact fleet numbers and naval strength remain undefined.
  tags: [geography]
  search_context: "Skardgard principal port of East, whalers, whaling, shipwrights, cold-sea sailors, fishing, whale oil, northern maritime trade."
