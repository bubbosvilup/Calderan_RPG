  name: "Zul-Rath"
  display_name: "Zul-Rath"
  parent: center
  aliases: []
  summary: >-
    Zul-Rath is Center's capital and its political and economic center, a Beastfolk-led city famous
    for the finest spices and silk in Helion and a major hub of slave export.
  content: >-
    Zul-Rath lies in Center's northern/central interior and is its political and economic center,
    culturally led by Beastfolk. Center's tournament-chosen ruler governs from here for five years,
    advised by old, mostly Beastfolk noble families who keep wealth and influence across reigns;
    the ruler's title, the current ruler and noble family names are not established. The city has a
    reliable freshwater supply and an oasis or water feature within or associated with it, and is
    one of the few major Center areas with meaningful local tree growth, though timber remains
    limited. Its wealth and elite prestige coexist with slavery, criminal commerce, unequal
    treatment, military culture and honour politics; it is a functioning major city with
    institutions, merchants, craft, nobility and law. Zul-Rath participates in Center's wider
    economic and military system and may employ or tolerate forces such as Sandspear's corsairs to
    disrupt shipping and West trade without formal national war. Khar-Dune intermediaries may route
    captives toward labor sites, works, or pits associated with Zul-Rath or Center. Its religion,
    exact architecture and districts remain undefined.
