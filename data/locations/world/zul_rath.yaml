chunks:
  - id: zul_rath.economy_and_society
    entity_id: zul_rath
    section: economy_and_society
    summary: Zul-Rath's luxury economy of spices and silk, resources, food and water, trade, foreign-facing human merchants and slave export.
    search_context: Zul-Rath economy, spice traders, spice trade, silk weavers, silk workers, fine textiles, luxury fabrics, human merchants, Beastfolk merchants, timber imports, irrigated farms, captives exported west.
    content: >-
      Zul-Rath's most famous products are spices and fine textiles, above all silk, among the
      highest-quality luxury goods in Helion. Center and Zul-Rath are the continent's dominant source
      of most culinary spices and of high-value spice trade; salt is not exclusive to Center and is
      also found elsewhere, including West. Zul-Rath silk and luxury textiles are expensive,
      prestigious and widely exported. Local resources include sand, stone, limited woodland and
      oasis water; food comes from irrigated production, regional agriculture where water permits and
      trade, and water remains strategically important. Zul-Rath exports spices, silk, fine textiles
      and luxury fabrics, desert luxury goods, and slaves and captives. It imports timber and
      high-quality wood for major construction, some of it through West and Calderan trade, plus some
      manufactured goods, selected Calderan metal and precision products, and foreign luxury goods;
      genuine Woodsong timber remains scarce. It trades with other Center settlements, with Calderan
      and West despite the rivalry, and with East where useful; no treaties or tariffs are
      established. Humans are disproportionately used as foreign-facing merchants and commercial
      intermediaries because they ease dealings with other nations and peoples; this is a social and
      institutional tendency, not a rule, and Beastfolk trade as well. Slave export is a significant
      part of the city's economy, including many Beastfolk captives: people treated by authorities or
      society as weak, troublesome, unwanted or burdensome, or who are captured or convicted, may be
      enslaved in this oppressive institution. A large share of Beastfolk slaves reaching West come
      through Zul-Rath and Center networks, though not all. Legal and illegal practice overlap
      heavily: abuses, falsified origins, illegal treatment and trafficking are common.
    tags:
