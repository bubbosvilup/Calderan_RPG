      description: "A tall fortified keep dominates the settlement on a rocky spur amid snowy peaks."
    - name: "iron and coal mining"
      description: "Major mining activity extracts iron and coal."
    - name: "military frontier garrison"
      description: "Patrols prevent West–Center violence from entering East."
    - name: "armed neutrality"
      description: "Frostspire enforces East's neutral stance toward the West–Center conflict, repelling incursions from either side when necessary."
