  summary: >-
    Frostspire is an iron-and-coal mining center and military frontier garrison in
    western/northwestern East near the Dragon's Teeth Mountains.
  content: >-
    Near the Center–East frontier zone, Frostspire stands on a rocky spur, dominated by a
    tall fortified keep surrounded by snowy peaks. Its dual role combines major mining with
    military frontier duty. Patrols actively prevent West–Center violence from spreading
    into East, helping enforce strong regional armed neutrality. Frontier forces may repel
    incursions or armed groups regardless of which side they originate from. This
    establishes neither an alliance nor friendship with West or Center, and does not define
    East's entire foreign policy.
