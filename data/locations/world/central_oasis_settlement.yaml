chunks:
  - id: central_oasis_settlement.red_waters
    entity_id: central_oasis_settlement
    section: red_waters
    summary: The Central Oasis water's unusual red reflections, a culturally notable phenomenon with no public explanation.
    search_context: Strange oasis water, red reflections, red glints, reddish shimmer, oasis water not blood, what is strange about the oasis, oasis wonder.
    content: >-
      The water of the Central Oasis shows unusual red reflections and glints, most noticeable in some
      light; the water itself is ordinary drinkable water, not blood, and is not reddened by any known
      mineral or dye. Travellers remark on it, and it is culturally notable among the oasis people and along
      the desert routes, but public knowledge does not explain why it happens. Any local customs, beliefs or
      taboos about it, and whether it changes over time, are not established.
    tags:
