chunks:
  - id: vaelrost.economy
    entity_id: vaelrost
    section: economy
    summary: Vaelrost's durable crafts, cold-weather goods and its role redistributing East's resources and imports.
    search_context: Vaelrost economy, Vaelrost craftsmen, furriers, leatherworkers, cold-weather clothing, practical smiths, preserved food, merchants, imported spices and silk.
    content: >-
      Vaelrost produces durable manufactured goods, cold-weather clothing, leather and fur work,
      practical metalwork and preserved food, and provides administrative and merchant services. It
      is not superior to Calderan in precision manufacture or to Frostspire in extraction. It
      receives iron, coal and raw materials from Frostspire, marine goods from Skardgard and other
      regional products, and imports or redistributes spices and luxury textiles and silk from Center,
      precision and luxury goods from Calderan, and selected southern foods and luxuries. It exports
      processed durable goods, cold-weather equipment and East's resources in redistributed form.
      Exact routes are not established.
    tags:
      - economy
      - trade
