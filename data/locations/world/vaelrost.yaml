  id: vaelrost
  type: location
  name: "Vaelrost"
  display_name: "Vaelrost"
  parent: east
  aliases: []
  summary: >-
    Vaelrost is East's political capital and a major urban center deep in the cold,
    snow-dominated eastern nation, its administrative seat and main trade and craft hub.
  content: >-
    Vaelrost lies farther east/northeast relative to Frostspire. It is East's administrative
    capital and military/political center, a cold-climate city that distributes the interior's
    resources and links Frostspire and Skardgard through trade and craft. Its internal government
    and culture remain deliberately underdefined. No ruler, dynasty, magical ice walls, or
    supernatural architecture is established.
  tags: [geography]
  search_context: "Vaelrost capital of East, cold city, craftsmen, furriers, leatherworkers, cold-weather clothing, practical metalwork, merchants, East trade hub."
