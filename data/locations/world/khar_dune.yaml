chunks:
  - id: khar_dune.caravan_economy
    entity_id: khar_dune
    section: caravan_economy
    summary: Khar-Dune's caravan, mercenary and frontier economy, its legitimate trade and its illicit overlap.
    search_context: Khar-Dune economy, caravan guards, desert guides, mercenaries, pack animals, water and provisions, trade brokers, smugglers, contraband.
    content: >-
      Khar-Dune lives as a caravan hub, frontier fortress, mercenary center, cross-border exchange
      point, contraband hub and transit point for captives. Its legitimate economy covers caravan
      provisioning, animal care, water, food, weapons and repair, lodging, guards, guides, desert
      travel supplies and trade brokerage. Its illicit economy covers smuggling, falsified captive
      origins, contraband, illegal cross-border commerce and hidden markets for captives. Center spices and
      textiles moving toward West, West manufactured goods moving toward Center, captives,
      contraband and caravan supplies all pass through it, along no single universal route. It is one
      of the main places where legitimate and illicit West–Center commerce overlap.
    tags:
      - economy
      - trade
