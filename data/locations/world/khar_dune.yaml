  name: "Khar-Dune"
  display_name: "Khar-Dune"
  parent: center
  aliases: []
  summary: >-
    Khar-Dune is Center's fortified frontier and caravan city in western/southwestern Center, a
    mercenary and cross-border exchange hub with major underground slave and contraband markets.
  content: >-
    Khar-Dune lies relatively near the West frontier and Chained Bay region at a strategic
    West–Center crossing. It developed around a watering point for mercenary caravans; military
    encampments, growing permanent defenses and the commerce serving soldiers and caravans turned it
    into a settlement surrounded by thick lime/mud-brick walls, and it grew in importance as
    unofficial West–Center conflict intensified. Compared with West's fortress-city across the frontier it is more caravan-oriented,
    mercenary-heavy and commercially rough, and more porous between legal and illicit commerce, with
    a desert Center character; it is still a functioning fortified settlement, not a lawless one.
    Desert raiders bring prisoners captured across the border. Intermediaries may obscure or falsify
    origin, clean provenance or records, and sell captives onward toward West merchants or labor
    sites, works, and pits associated with Zul-Rath/Center. Its underground markets include slaves,
    contraband, and illicit cross-border trade. Not every resident is criminal. No named gangs or
    complete criminal hierarchy are established.
  tags: [geography]
  search_context: "Khar-Dune frontier caravan city of Center, desert guides, mercenaries, cross-border trade, smugglers, falsified papers, contraband."
