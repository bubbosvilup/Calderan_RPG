  content: >-
    The South Continent is one of the four great divisions of Helion, together with West, Center
    and East, and lies to the south of the other three. Like them it is traditionally associated
    with one of the Four of sacred tradition. "South Continent" is a descriptive designation, not a
    proper name. Its borders and extent, peoples, cities, government, economy, religion and culture
    are not established, and it has no capital in current canon.
