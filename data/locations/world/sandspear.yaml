chunks:
  - id: sandspear.maritime_economy
    entity_id: sandspear
    section: maritime_economy
    summary: Sandspear's shipbuilding, fishing, corsair and maritime economy, legal and illicit trade, and its rivalries with Davenport and Blackwater.
    search_context: Sandspear economy, corsairs, privateers, fast ships, shipwrights, ship repair, sailors, fishers, captured cargo, maritime trade, Center goods by sea, Davenport rivalry.
    content: >-
      Sandspear's economy includes shipbuilding, ship repair, fishing, maritime trade, corsair
      activity, mercenary maritime work, seized and captured cargo, slave trafficking, and sailors and
      naval labour. Its vessels are generally built for speed, raiding, desert-coast conditions and
      corsair or privateering roles; Davenport remains superior and more famous for large
      conventional and fleet shipbuilding. Legal commerce includes fish, ship services, maritime
      cargo, Center goods, and spices and textiles in transit; illicit or semi-legal commerce
      includes captured cargo, slaves, contraband and piracy spoils. With Davenport it has a
      geopolitical rivalry of maritime incidents, raiding and privateering, and commercial
      competition; with Blackwater, competition over piracy and contraband and mutual hostility,
      though opportunistic dealings still happen. Neither is a formal permanent war, and no pirate
      code or admiralty system is established.
    tags:
      - economy
      - maritime
