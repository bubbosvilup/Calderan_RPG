      description: "Zul-Rath"
    - name: "land border with West"
      description: "Center directly borders West."
    - name: "land border with East"
      description: "Center directly borders East."
    - name: "arid regional climate"
      description: "Broadly arid and desert-dominated; not a uniform climate rule."
