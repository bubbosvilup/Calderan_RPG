chunks:
  - id: center.society_and_law
    entity_id: center
    section: society_and_law
    summary: Center's magic prohibition, five-year tournament rulership, noble continuity and the porous West–Center rivalry.
    search_context: Center law, magic forbidden, magic punishment, mages in Center, ruler tournament, five-year rule, martial duels, Beastfolk nobility, who rules Center, West–Center rivalry and trade.
    content: >-
      Because Beastfolk cannot use magic, magic is widely seen in Center as alien, dangerous and
      untrustworthy, and it is prohibited throughout Center; punishment depends on severity and
      context and may include imprisonment, exile or severe criminal penalties, and death in extreme
      cases of lethal magical violence. This is national law and culture, not every individual's
      attitude, and no detailed criminal code is established. Center's ruler is chosen every five
      years by a dangerous martial tournament of duels without magic, sometimes fought to the death;
      the winner rules Center from Zul-Rath for five years and may never compete again, while old,
      mostly Beastfolk noble families keep wealth, advise each ruler and provide continuity. The
      ruler's title, the current ruler and the tournament's detailed rules are not established.
      West–Center trade continues across the rivalry, and elites on both sides can profit from
      conflict, captives, displaced people, weapons, trade disruption and slave commerce. The
      rivalry's deep origin is undefined, and neither side is established as having deliberately
      created it.
