schema_version: 1
entity:
  id: center
  type: location
  name: "Center"
  display_name: "Center (nation)"
  parent: continent
  aliases: []
  summary: >-
    Center is the central, broadly arid and desert-dominated nation, Beastfolk-led and martial,
    famous for spices and silk; Zul-Rath is its capital.
  content: >-
    Center directly borders West and East. Its major mapped settlements are Zul-Rath,
    Khar-Dune, Sandspear, and an oasis settlement in the desert interior between Khar-Dune
    and Zul-Rath, without excluding other settlements. The Dragon's Teeth Mountains complicate
    passage across northern portions of the Center–East transition. Beastfolk are politically and
    culturally central to Center and form most of its traditional upper class, though humans and
    other peoples also live there. Its culture is broadly honour-conscious, martial, proud,
    commercially active and deeply involved in the slave trade, and it is a functioning
    civilization with institutions, law, nobility, merchants and prestige craft, not merely a
    slave or criminal economy. Magic is prohibited throughout Center, and its ruler is chosen
    every five years by a martial tournament. West–Center relations are hostile and rivalrous,
    with recurring frontier skirmishes but no formally declared total war, and remain economically
    porous. Zul-Rath may employ or tolerate Sandspear corsairs when useful. Center's religion
    remains undefined.
  tags: [geography]
  search_context: "Center nation on Aureth, the known continent, distinct from Calderan's Center District; Beastfolk-led desert nation, spices, silk, honour and martial culture, magic forbidden, five-year ruler tournament."
