  tags: [ "politics", "governance" ]
  search_context: "Ducal Citadel, Duke Uther Calderan, ducal court, Ducal Council, administration, seat of government"
  content: >-
    The Ducal Citadel is the primary residence and administrative seat of Duke Uther Calderan and the
    political center of Calderan. It holds the private ducal residence, the ducal court, executive
    administration, official city and state business, and the functions of the Ducal Council. The Calderan
    Civil Registry, the Ducal Archive, the Office of Holdings and Title and the High Courts of Calderan stand
    nearby, as do the representative offices of the three guilds and the Church.
