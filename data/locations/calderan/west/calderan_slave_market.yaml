  search_context: Calderan Slave Market, Slave Pens, slave market, slave auction, public auction, licensed
    private sellers, holding pens and authorized sale documentation.
  content: "A public, legal slave market in Calderan's West District, publicly known, about 20 minutes' walk
    from Heartstone. Its very large square exceeds Main Market Square: practical packed earth, gravel and
    dirt, muddy in poor weather, sometimes dirtied by blood and animal/human traffic. This major economic
    center has heavy daytime traffic: buyers, sellers, slaves, caravans, handlers, clerks, guards, spectators
    and auctions. Slavery is legal and socially accepted; ordinary attendance is not clandestine. The complex
    operates around the clock, formal auctions primarily by day, direct purchases outside auction hours, much
    less activity at night. The general authorized public auction has no named operator. Low-level authorized
    clerks handle required ownership documentation at official auction sales; licensed private sellers handle
    or arrange their own authorized sale documentation. No routine health certification requirement is
    established; no systematic doctors or medical inspection are present. Licensed sellers behind/around the
    auction conduct private acquisitions: Korvin is generalist, Mistress Elara handles prestigious and
    socially useful captives, Bartolomhew specializes in Beastfolk and labor/workforce categories. They do not
    operate the public auction. The taboo Back Alleys and deeper criminal layer are distinct. No dominant
    origin or percentages: sources may include war prisoners, convicted criminals, hereditary slavery, debt,
    economic ruin, refugees, criminal trafficking, vulnerable Beastfolk, captured elves,
    bandit/criminal-associated captives and other legally processed or illicitly laundered captives. Not every
    refugee, Beastfolk or elf is enslaved."
