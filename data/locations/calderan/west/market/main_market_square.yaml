  search_context: Main Market Square ordinary shopping, everyday goods, shops near Heartstone, West
    commercial services.
  content: The square lies in the more prosperous part of West toward Center, approximately 30 minutes
    on foot from Heartstone. It is smaller than Calderan Slave Market and serves ordinary shopping.
    Numerous unnamed stalls and services supply most everyday needs at low to lower-middle prices
    and ordinary to decent quality. Rare, elite or prestigious goods generally require East, North
    or Center. The Daily Grind, Blackiron Repairs & Arms, Mudlark's Herbs and Livia's Needles are
    four important businesses on the square. Fountain of the Fallen stands at its center and is a
    common meeting landmark. Second Chance Pawn and West Guard Post are nearby. The walking estimate
    establishes no exact route.
