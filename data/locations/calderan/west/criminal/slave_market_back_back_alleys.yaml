chunks:
  - id: slave_market_back_back_alleys.criminal_interior
    entity_id: slave_market_back_back_alleys
    section: criminal_interior
    summary: Private details of the Back-Back Alleys criminal economy.
    search_context: Private details of the Back-Back Alleys criminal economy.
    content: "Accessible through the Back Alleys, the interior is labyrinthine: narrow alleys, degraded buildings,
      unpleasant smells, controlled entrances and criminal lookouts. Multiple gangs control passage.
      Activities may include undocumented or kidnapped captives, trafficked refugees and families, adults and
      children as nonsexual victims of trafficking or exploitation, gravely sick or injured captives, dying
      people, completely off-record sales, forged papers, corrupt brokers and bribed guards. Clandestine
      doctors, apothecaries or alchemists and illicit acquisition of cadavers or anatomical material may
      occur. These are private details, not ordinary local knowledge."
    tags: []
    knowledge:
      visibility:
        narrator: true
        player: false
      known_by: []
      awareness: private
  - id: slave_market_back_back_alleys.criminal_network
    entity_id: slave_market_back_back_alleys
    section: criminal_network
    summary: Private boundaries of criminal coordination and river transit.
    search_context: Private boundaries of criminal coordination and river transit.
    content: Multiple criminal organizations with their own leadership participate and cooperate enough to keep
      the illicit economy operating. No single gang owns the whole area. Corruption reaches some guards,
      brokers and wealthy clients and is particularly severe around this deeper trade. Some higher
      coordinating authority or network appears to exist; the ultimate coordinator identity and location are
      unestablished. Groups use warehouses near Grey Brook for some illicit transport of people or goods;
      exact bases, routes and contacts are unknown.
    tags: []
    knowledge:
      visibility:
        narrator: true
        player: false
      known_by: []
      awareness: private
  - id: slave_market_back_back_alleys.remains_handoff
    entity_id: slave_market_back_back_alleys
    section: remains_handoff
    summary: Private, bounded canon about covert removal of unwanted remains.
    search_context: Private, bounded canon about covert removal of unwanted remains.
    content: When bodies or remains have no further value to illicit buyers, criminal operators may pay corrupt or
      discreet undertakers or body-removal services to dispose of them. The Undertaker's Door is slang for a
      covert handoff or contact in this economy, not necessarily a literal door or building. No named
      undertakers, exact contacts or disposal procedures are established.
    tags: []
    knowledge:
      visibility:
        narrator: true
        player: false
      known_by: []
      awareness: private
