  search_context: Back Alleys, taboo sensitive private sales behind Calderan Slave Market.
  content: "Known locally but taboo, the Back Alleys handle sensitive private sales: violent captives,
    dangerous criminals, difficult-to-control slaves, unusual or highly specific requested
    characteristics, moderately ill or injured but commercially viable captives, and difficult debt
    cases. The whole area is not openly criminal or inherently illegal. Guard presence is low;
    guards generally avoid entering without reason. Many locals imperfectly know that something
    deeply wrong happens farther beyond, without knowing exact details. The Back-Back Alleys are a
    distinct deeper layer, not normal public market space."
