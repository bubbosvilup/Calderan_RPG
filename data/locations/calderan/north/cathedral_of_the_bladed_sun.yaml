      description: Constantly burning sacred furnaces whose smoke rises above the cathedral and darkens its spires.
    - name: white granite and cast iron
      description: Monumental white granite and cast iron, sharp buttresses and severe vertical lines.
    - name: canonical map placement
      description: "North of the northern red road, west of the Bastion. Access: north_arterial_west."
