  summary: >-
    The Cathedral of the Bladed Sun in Calderan's North District is the primary headquarters of the Church of
    the Sun Emperor, the supreme liturgical center of West and the seat of the High Archon of the West.
  tags: [ "religion", "architecture" ]
  search_context: "Cathedral of the Bladed Sun, Church headquarters, High Archon seat, white granite cathedral,
    sacred furnace, spires"
  content: >-
    The Cathedral of the Bladed Sun is the Church of the Sun Emperor's primary headquarters, the supreme
    liturgical center of West and the administrative seat of the High Archon of the West. It is built of
    monumental white granite and cast iron, with sharp buttresses, severe verticality and soot-darkened spires
    above which smoke from sacred furnaces rises constantly. It dominates North visually. It is a
    fortress-temple designed to make visitors feel small, sinful and subordinate. The Sun Emperor does not
    reside here.
