  content: >-
    The Spire Academy is an elite academy, not a mass magic school, with approximately 120 students. It stands
    near The Collegium but is a separate institution. Its students include rare genuine young mages, noble
    children, rich merchant children and elite non-magical students. Subjects may include law, logistics,
    philosophy, architecture, military architecture, advanced scholarship and regulated arcane studies. Most
    students are not expected to become true mages; true mana manipulation remains rare, although mana is
    broadly present in living beings.
