  summary: Heartstone is an old, tall private residential tower of predominantly stone construction.
    It is vertically organized, structurally solid, and associated with a secluded walled courtyard.
  tags:
    - household
    - architecture
    - domestic
  search_context: Heartstone residential stone tower, upper floors, underground level, living floor,
    secluded courtyard.
  content: Heartstone is a private residence. Its old stone tower construction is partly accented by
    projecting wooden architectural sections and narrow arched tower windows. The structure remains
    solid despite its age. The known organization consists of U1 underground, LR at ground level, F1
    through F6 rising above LR, and CY, the secluded courtyard. F6 is the highest currently known
    floor. U1 has a broader underground footprint than the tower floors above. A single continuous
    spiral staircase rises from LR through F1, F2, F3, F4, F5, and F6. This staircase begins at LR's
    perimeter and rises along or near the outer portion of the tower interior, reaching each upper
    floor from the side. It is lateral/peripheral, not a central tower core, leaving each upper
    floor's central usable area comparatively open. U1 is reached separately through a large visible
    hatch in LR and descending access, not through the upper-floor spiral staircase. Heartstone lies
    in the north-western part of Calderan's West District.
