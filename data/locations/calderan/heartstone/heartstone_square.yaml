  search_context: Public square or open area immediately outside Heartstone Tower's main entrance.
  content: Heartstone's massive main entrance opens directly onto this public square, outside the
    tower's structure. The square is reasonably broad but is not a major civic square. Moderate
    daytime foot traffic is quieter than at Main Market Square. Low residential buildings
    predominate, with few nearby shops and no major commercial concentration. Night safety is
    mediocre. The low-end, disreputable tavern The Coined Lie faces or directly adjoins the square.
    The White Basin is a laundry near Heartstone, without an established position directly on the
    square.
