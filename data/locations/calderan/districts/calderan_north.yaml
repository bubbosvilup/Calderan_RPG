entity:
  id: calderan_north
  type: location
  name: North District
  display_name: Calderan North District
  parent: calderan
  aliases:
    - Calderan North District
  summary: North District is Calderan's religious, medical, scholarly and regulated-magic district and
    its second-wealthiest after Center, built of pale worked stone and white granite around the
    Cathedral of the Bladed Sun, cloisters, gardens and major Church and Learned Arts institutions.
  tags:
    - geography
    - district
    - religion
    - medicine
  search_context: North District of Calderan, urban district, Church of the Sun Emperor, Cathedral of
    the Bladed Sun, Saint Caldus House, The Collegium, Mage Registry, Spire Academy, Bastion of
    Vigilance, Pyres of the Fallen, physicians, apothecaries.
  content: "North concentrates religion, medicine, scholarship and regulated magic. It is Calderan's
    second-wealthiest district after Center, but it is not primarily a noble residential district.
    Pale washed stone and white granite, monumental religious architecture, cloisters, fountains,
    formal gardens, parks and clean public spaces set it apart; it has more green space and better
    maintenance than the other outer districts. The Cathedral of the Bladed Sun dominates it visually.
    The Church of the Sun Emperor, the City Guard and the Inquisition are all strongly present, and
    visible street crime is low. The atmosphere is superficially calm and orderly over underlying
    institutional control. Major institutions here include Saint Caldus House, the Church's main
    hospital; the Pyres of the Fallen, the principal cremation complex; The Collegium, headquarters of
    the Learned Arts Guild and home of the Mage Registry; the nearby Spire Academy; and the Bastion of
    Vigilance, the Inquisition's headquarters. Physicians, apothecaries, alchemists and herbalists are
    concentrated here under close supervision. Sincere treatment, competent practitioners, ineffective
    treatment, superstition and charlatans can coexist. Religion is not universally fraudulent and
    temple healing is not universally magical. Charity draws many poor and displaced people toward North's
    temples and Church kitchens. These are predominant tendencies, not exclusive zoning. Crossing
    substantial parts of a district is meaningful travel; no exact roads or navigation routes are
    established."
