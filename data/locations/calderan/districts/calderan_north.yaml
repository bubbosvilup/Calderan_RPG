chunks:
  - id: calderan_north.medical_regulation
    entity_id: calderan_north
    section: medical_regulation
    summary: Licensing of private clinics, supervision of apothecaries and alchemists, and regulated
      medicinal warehousing in North District.
    search_context: North clinic licensing, unlicensed healer, apothecary records, alchemist
      supervision, controlled substances, medicinal warehouses, Church Auditors, Inquisition review.
    content: "Independent lay medicine is legal elsewhere in Calderan, but a practitioner may not simply
      open an unsanctioned clinic in North. Private clinics there require authorization shared between
      religious and inquisitorial oversight and Learned Arts Guild professional competence. An
      unlicensed North clinic is treated as suspicious and may be investigated, or destroyed if it is
      considered a center of illicit magic or heresy; not every unlicensed healer is automatically
      guilty. Apothecaries and alchemists operate primarily under Learned Arts professional structures
      and are heavily supervised in North. Their sales and controlled-substance records may be sealed,
      inspected and reviewed annually by Church Auditors and the Inquisition; no catalog of controlled
      substances is established. North's major medicinal and alchemical stores are mixed-property
      institutions held by guild-affiliated private interests, nobles or large commercial holders, not
      by the state. Medicinal and alchemical supply is nevertheless heavily regulated, taxed and
      watched, and is sometimes escorted or protected by Church-linked authorities."
    tags:
      - medicine
      - regulation
      - alchemy
