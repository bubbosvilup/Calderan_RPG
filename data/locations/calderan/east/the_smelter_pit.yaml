  search_context: "Smelter Pit, East District foundries, smelters, furnaces, heavy metalworking, smoke, industrial sector"
  content: >-
    The Smelter Pit lies slightly lower than the surrounding East District and is dominated by
    foundries, smelters, heavy metalworking and industrial transport, with furnace smoke, hammer
    noise and heat. Much of East's visible smoke and haze originates here. It is industrial and
    hard-working, not a slum. Beastfolk slave labor is common in its heavy work.
