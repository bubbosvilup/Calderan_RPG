entity:
  id: "light_and_shadow"
  type: "world_lore"
  name: "Light and Shadow"
  display_name: "Light and Shadow"
  parent: null
  aliases: ["Light magic", "Shadow magic"]
  summary: >-
    Light and Shadow are exceptionally rare magical classifications, not moral alignments. Church
    doctrine treats true Light as divine and Shadow magic as absolute heresy.
  tags: ["magic"]
  search_context: "Light magic, Shadow magic, Light and Shadow mages"
  content: >-
    Light is not inherently good; Shadow is not inherently evil. Both are nearly legendary in
    ordinary experience, known more through stories, records, rumor, and rare cases than
    everyday observation. They may have unusual interactions or opposition with one another;
    no full combat matrix is established. Publicly, the Church of the Sun Emperor teaches that the
    Sun Emperor bears divine Light and that true Light is a miracle or divine manifestation; mortal
    Light magic is not accepted as a normal magical school. In learned and arcane circles only
    fragmented accounts of Light users exist, usually read as legend, religious metaphor or an
    extinct phenomenon. Shadow magic is extremely rare, absolute heresy in Church doctrine and
    actively hunted. Clearly identifiable public use of either may attract major attention:
    surprise, fear, distrust, rumor, withdrawal, institutional interest, reports to authorities, or
    investigation by Church/Inquisition-related actors. Responses depend on context; no spell
    automatically summons the Inquisition. No Light hero, Shadow villain, or required conflict is
    established.
