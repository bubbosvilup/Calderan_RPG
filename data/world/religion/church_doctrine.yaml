entity:
  id: church_doctrine
  type: world_lore
  name: "Doctrine of the Church of the Sun Emperor"
  display_name: "Doctrine of the Church of the Sun Emperor"
  parent: null
  aliases: ["Church doctrine","Sun Emperor doctrine"]
  summary: >-
    Public doctrine of the Church of the Sun Emperor: Aureth, the Sun Emperor, as divine, immortal
    founder, sovereign and bearer of purifying Light, who disappeared in Year 491; Shadow as
    forbidden and corruptive; and the virtues of obedience, duty, labor, sacrifice, endurance and
    social order.
  tags: ["religion","doctrine"]
  search_context: "Church doctrine, Sun Emperor, Aureth, divine Light, purification, Shadow, obedience, duty, sacrifice, suffering, afterlife, cremation, slavery doctrine"
  content: >-
    The Church of the Sun Emperor teaches that the Sun Emperor, Aureth, is West's divine sovereign,
    founder and protector, immortal, the source or bearer of purifying divine Light, and the
    protector of humanity and order against corruption and Shadow. Its core virtues are
    obedience, duty, labor, sacrifice, endurance and social order. Suffering is not worshipped
    for its own sake; suffering endured in service, discipline or purification may have
    spiritual value, while needless suffering that destroys a useful servant of the social and
    divine order is waste. The body is an instrument entrusted to each person by divine order,
    and healing restores it to work, duty, military service, family function and social role;
    Church medicine is framed as restoration to proper function rather than as compassion for
    the individual, although individual clergy may be genuinely compassionate. These are
    doctrinal beliefs, not proven cosmology.
  knowledge: {"visibility":{"narrator":true,"player":true},"known_by":[],"awareness":"public"}
