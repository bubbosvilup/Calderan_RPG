  related_entities: ["church","sun_emperor","light_and_shadow","west_slavery","aureth_creation_myth","the_four","forgotten_era","modern_reckoning"]
chunks:
  - id: church_doctrine.founder_and_shadow
    entity_id: church_doctrine
    section: founder_and_shadow
    summary: "Church teaching on the Sun Emperor as founder and protector of the ordered world, his long absence, the prohibition of Shadow, and the older dragon myth."
    search_context: "Sun Emperor founder, Aureth, creation, protector of the world, absent emperor, disappearance in Year 491, seven hundredth anniversary, awaited return, the Four, Forgotten Era, why Shadow magic is forbidden, Shadow heresy, Church and the old creation myth, ancestral folklore"
    content: >-
      The Church teaches that Aureth, the Sun Emperor, revealed himself to the world in Year 0, founded
      and protects the divinely ordered world and that his Light sustains that order. He disappeared in
      Year 491; the Church does not teach how or why, does not declare him dead, and believers variously
      regard him as hidden, withdrawn into divine transcendence or awaiting the hour of his return, while
      West remains governed in his name. The present year, 1191, is the seven-hundredth anniversary of
      the disappearance, a date the Church treats as significant. The Church teaches that the Four, the
      great elemental figures of the four regions, were ordered and blessed under the Sun Emperor's reign,
      and that the age before Year 0, the Forgotten Era, was spiritually dangerous and unreliable, so
      that its records are restricted. The Church holds that its prohibition of Shadow rests on the Sun Emperor's own teaching:
      Shadow is forbidden, corruptive and hostile to the divine order and to creation, and Shadow magic
      is absolute heresy. The older ancestral traditions, which draw Aureth and the Four as dragons, predate
      the Church, which absorbed, reinterpreted or overwrote much of them within its own account and
      treats the dragon imagery itself as folklore. These are doctrinal beliefs, not proven cosmology; the details of
      the founder's teaching and of any expected return are not established.
    tags: ["shadow","founder"]
    knowledge: {"visibility":{"narrator":true,"player":true},"known_by":[],"awareness":"public"}
  - id: church_doctrine.afterlife_and_funerary
    entity_id: church_doctrine
    section: afterlife_and_funerary
    summary: "Church teaching on death and the afterlife, and the mandatory cremation of the dead."
    search_context: "afterlife, death, righteous, heretics, burial ban, cremation, Rite of Final Flame, ashes, corpses, Shadow corruption"
    content: >-
      The Church teaches that the righteous are forged and refined in divine Light and continue
      serving as guardians in eternity, while heretics and contaminated souls are consumed, burned
      away, denied meaningful continuation and cast into darkness or oblivion; this is belief, not
      demonstrated fact. Because unpurified corpses are believed to remain vulnerable to
      corruption and Shadow, burying intact bodies underground without authorized cremation is
      illegal. The general flow is death, Church custody or a recognized funerary process, the
      Rite of Final Flame, cremation, and handling of the ashes according to status. The Pyres of
      the Fallen in North are the principal cremation complex. Exact funerary law and penalties
      are not established.
    tags: ["death","funerary"]
    knowledge: {"visibility":{"narrator":true,"player":true},"known_by":[],"awareness":"public"}
  - id: church_doctrine.slavery
    entity_id: church_doctrine
    section: slavery
    summary: "The Church provides theological justification for slavery; the metaphysical status of enslaved souls is unresolved."
    search_context: "Church and slavery, ordained hierarchy, divine standing, servitude, slaves, souls"
    content: >-
      The Church does not merely tolerate slavery; it provides theological justification for it.
      It speaks of an ordained hierarchy, differing divine standing, reduced social and spiritual
      status, and service as an imposed function within the divine order. Whether enslaved people
      have souls, and in what sense, is not defined; the Church does not teach that all slaves
      literally lack souls, and free people may become enslaved through mechanisms not yet
      authored. Detailed slavery theology and law remain undefined.
    tags: ["slavery"]
    knowledge: {"visibility":{"narrator":true,"player":true},"known_by":[],"awareness":"public"}
