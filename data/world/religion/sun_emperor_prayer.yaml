  content: >-
    The Canticle of the Watchful Sun is among the oldest prayers of the Church, attributed by tradition to the
    Sun Emperor himself, and it is known by heart to many believers across Helion. Its text runs:


    "Keep me in the Light, and the Light in my keeping.

    Let no voice sweeter than the dawn lead me from the dawn.

    Where pride wears the colors of humility, let me look twice.

    Where the dark is kind to me, let me ask what it costs.

    What is hidden from the Sun is not hidden from the Sun's watch;

    let the faithful keep the vigil until the morning returns."


    The Church teaches it as a devotional warning against darkness, pride, false voices, corruption and
    separation from the Light, and recites it in vigils and at the centennial observances. Readers have
    always found it a gentle prayer; no gloss is established beyond the Church's own.
