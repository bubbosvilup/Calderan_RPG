  name: "Continental Structure"
  display_name: "Continental Structure"
  parent: null
  aliases: []
  summary: >-
    One enormous known continent, Aureth, contains the major geopolitical regions/nations West,
    Center, and East.
  tags: ["fundamentals"]
  search_context: ""
  content: >-
    The known continent is conceptually Eurasia-scale, with no exact dimensions, area, or
    travel times. West, Center, and East occupy its western, central, and eastern portions.
    West borders Center; Center borders East; West and East share no direct land border.
    West is broadly mild, temperate, and greener; Center arid and desert-dominated; East cold
    and snowy with severe winters. These are regional tendencies. Their capitals are
    Calderan, Zul-Rath, and Vaelrost respectively. Mist Sea lies north, Sorrow Sea west,
    The Silent Ocean east, and Chained Bay around the southwest. The Dragon's Teeth Mountains
    form a spine across the northern and eastern side, from near the forest north of Calderan
    to the Center–East transition and Frostspire. West–Center
    tension is not perpetual declared total war: border skirmishes, raids, territorial
    incidents, feuds, localized clashes, and unofficial frontier violence can produce
    captives, displaced civilians, raided villages, prisoners, and slave trafficking.
    Not every enslaved person is a Center captive. Center is Beastfolk-led and prohibits magic;
    its ruler is chosen every five years by a martial tournament, with details undefined. East enforces armed neutrality against spillover from that conflict,
    notably through Frostspire. East is a resource-rich, pragmatic, climate-constrained land of
    mining, cold seas and durable craft. East's internal government, religion, peoples, internal
    factions, and foreign policy beyond this stance remain undefined. No other continent
    is established.
