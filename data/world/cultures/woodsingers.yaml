    content: >-
      Woodsinger tradition reveres an ancient sacred tree deep in Woodsong Forest, associated with the forest's
      continuity and protection. This is cultural belief and reverence; outsiders know little more, and the
      Woodsingers do not share its location or their traditions about it.
