  name: The Four
  display_name: The Four
  parent: null
  aliases: ["the Four Guardians", "the four sacred figures"]
  summary: >-
    The Four are the sacred elemental figures of tradition, each tied to one of Helion's four great divisions
    and to one element: Earth with West, Fire with Center, Water with East and Air with the South Continent.
    Their nature is understood in many ways.
  tags: ["myth", "religion"]
  search_context: "The Four, four sacred elemental figures, guardians of the four regions, West Center East South Continent, Earth Fire Water Air, elemental correspondences, sacred figures, old iconography, folk tradition."
  content: >-
    In the traditions of Helion there are Four sacred elemental figures, each associated with one of the
    four great divisions and with one of the four elements of magic: Earth with West, Fire with Center, Water
    with East and Air with the South Continent. The correspondence is an old and widely repeated tradition,
    not a statement about the character of any people; the peoples of each division are as varied as people
    anywhere. Traditions interpret the Four as guardians, divine servants, primordial figures or sacred
    elemental presences, and no single account is settled; Church teaching holds that Aureth, the Sun Emperor,
    ordered and blessed them under his reign. Whether they still stir, what they are in truth and what the
    traditions have lost are not publicly established. Their names, forms and powers are not established.
