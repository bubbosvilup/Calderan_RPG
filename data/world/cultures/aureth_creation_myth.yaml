entity:
  id: aureth_creation_myth
  type: world_lore
  name: The Creation Myth of Helion
  display_name: The Creation Myth of Helion
  parent: null
  aliases: ["Myth of Aureth", "Aureth creation myth"]
  summary: The creation myth taught across Helion tells that the world arose from primordial powers, that Aureth, the Sun
    Emperor, brought sacred Light, order and guidance to humanity, and that the Four were ordered and blessed under his
    reign; Shadow is the corruption that opposes that order.
  tags:
    - myth
  search_context: Creation myth of Helion, Aureth and the Sun Emperor, sacred Light, origin of the world, primordial powers, the Four, old folklore, dragons in folk art, golden dragon image, ancestral custom.
  content: In the creation myth as the Church teaches it, the world emerged from primordial powers. Aureth, the
    Sun Emperor, brought sacred Light, order and guidance to humanity, and the Four, the great elemental figures
    associated with West, Center, East and the South Continent, were brought into harmony and blessed under his
    reign. Shadow is presented as corruption, danger and the absence of the sacred order, opposed to Light. Older
    ancestral and folk traditions tell the tale differently and more richly, and they survive as folklore, custom and
    old stories; in folk art Aureth is sometimes drawn as a golden dragon, and the Four as dragons, which is
    traditional iconography, not an established account of what they are. The Church has absorbed, reinterpreted or
    overwritten much of the older tradition within its own doctrine. In public knowledge this is mythology, not
    established fact. Whether the world was literally made this way, the origin and nature of the Four, any older
    worship, cult, temples or relics, powers, dates and any political claims based on the myth remain unestablished.
  knowledge:
    visibility:
      narrator: true
      player: true
    known_by: []
    awareness: public
