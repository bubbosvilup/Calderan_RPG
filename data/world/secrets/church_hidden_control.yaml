entity:
  id: church_hidden_control
  type: world_lore
  name: "Sealed Truth: The Church and the First Voice"
  display_name: "Sealed Truth: The Church and the First Voice"
  parent: null
  aliases: []
  summary: >-
    Author-only world truth: the Church of the Sun Emperor sincerely worships Aureth but is structurally
    controlled by the First Voice; most of its members, high and low, are sincere and do not know it.
  tags:
    - secret
    - world_truth
  search_context: Sealed world truth
  content: >-
    Tier 3 author-only world truth; no character knows it by default. The Church of the Sun Emperor genuinely
    worships Aureth, Light and the ideals attributed to him, and the great majority of its members are sincere:
    priests who help the poor, inquisitors who believe forbidden records endanger souls, bishops moved by politics,
    archivists who follow rules without knowing why. The Church does not knowingly worship Shadow. The First Voice
    shaped, captured, redirected or infiltrated the institution so thoroughly that its highest hidden purpose serves
    Shadow's long-term interests while its public faith stays devoted to Aureth, and it keeps Aureth's truth buried.
    The Church was not Shadow's from the start. It began in Year 0 after Aureth's revelation as a genuinely
    benevolent and devoted body that supported his continent-wide rule and organized worship, charity, social order
    and administration; it was not secretly founded by Shadow, was not originally corrupt, and had no Inquisition.
    After Year 491 the First Voice gradually manipulated influential people and structures: power centralized,
    censorship increased, pre-Year-0 records were restricted, doctrine hardened, the persecution of magic
    expanded, political influence grew, and the Inquisition was created after 491. The direction and mechanism are
    canon; the individual steps over the centuries are not. The visible Church has ordinary leadership
    and ordinary succession; the First Voice does not rule it visibly and is not publicly known. Knowledge is layered:
    the public and ordinary clergy hold public doctrine; some senior clergy know that pre-Year-0 records are
    restricted and that doctrine is curated; a very small number know of an ancient hidden authority without knowing
    what it is; only the First Voice knows the whole truth. Pre-Year-0 sources are suppressed because they can reveal
    the cosmology: that Light and Shadow both took part in creation and are complementary, that both incarnate,
    that Aureth is an incarnation of Light and not the creator of existence, that the Four predate his revelation, that
    Eldaven was the ancient name of the continent, and that modern Church mythology is incomplete or deliberately
    false. Surviving fragments are partial and do not each contain all of this. Since Year 491 the Church has grown in
    institutional influence. The First Voice's means of reaching the Church are recorded in a further sealed truth.
  knowledge:
