  content: >-
    Tier 2 manual secret. The holder knows only that an ancient hidden authority, called the First Voice, guides the
    highest counsel of the Church of the Sun Emperor, and that the Sun Emperor's disappearance in Year 491 was not
    an ordinary death. The holder does not know what the First Voice is, how it came to guide the Church, who or what
    caused the disappearance, or anything of Light and Shadow as incarnating forces. This is a deliberately small
    and partial piece of knowledge. Holders are assigned only by explicit authoring of known_by, and rank does not by
    itself confer this knowledge.
