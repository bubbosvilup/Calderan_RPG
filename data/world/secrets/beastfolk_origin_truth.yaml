  name: "Sealed Truth: The Maker of the Beastfolk"
  display_name: "Sealed Truth: The Maker of the Beastfolk"
  parent: null
  aliases: []
  summary: >-
    Author-only world truth: the red dragon of Center, kinder toward mortal peoples than her elder brother, created the
    Beastfolk; the truth is almost completely lost.
  tags:
    - secret
    - world_truth
  search_context: Sealed world truth
  content: >-
    Tier 3 author-only world truth; no character knows it by default. The red dragon of Center was traditionally more
    compassionate and benevolent toward mortal peoples than her elder green brother, and she created the Beastfolk.
    This is objective world truth, not religion or myth, but it has been lost almost completely: the Beastfolk do not
    generally know their creator, Center's political establishment does not know it, it is not scholarship and it is
    not Church doctrine. How she created them, when, and why Beastfolk cannot use magic are not established.
