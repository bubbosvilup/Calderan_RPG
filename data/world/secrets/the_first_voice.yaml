  name: "Sealed Truth: The First Voice"
  display_name: "Sealed Truth: The First Voice"
  parent: null
  aliases: []
  summary: >-
    Author-only world truth: the First Voice is the current incarnation of Shadow, the hidden ultimate antagonist
    who sealed Aureth in Year 491 and who secretly directs the Church of the Sun Emperor.
  tags:
    - secret
    - world_truth
  search_context: Sealed world truth
  content: >-
    Tier 3 author-only world truth; no character knows it by default except, in the fiction, the First Voice. The
    First Voice is the canonical title of the current incarnation of Shadow, one of the six primordial forces, which
    incarnates cyclically; it is functionally immortal or extraordinarily long-lived and is the central hidden
    antagonist of the modern age. In Year 491 it sealed Aureth, the current incarnation of Light. It did not
    destroy him, because Shadow cannot safely erase Light without damaging the balance that both need; it isolated
    him instead. It is the hidden supreme authority behind the Church of the Sun Emperor, whose structure is recorded
    in its own sealed truth, and it is the only character who unquestionably holds the complete modern deep truth.
    The title is itself highly restricted: ordinary people do not know that Shadow incarnates, that the First
    Voice exists, that it directs the Church, that Aureth was sealed, or that Light and Shadow are both required
    forces. It works through institutions, doctrine, succession and the suppression of the Forgotten Era, not through
    open force. It is not the hidden cause of every evil: the West-Center conflict, the slave trade, political
    corruption and crime exist and persist through ordinary mortal causes, and no current event is established as
    its work. Its personal name, birth, body, appearance, visible disguise, location, age, abilities, the exact
    mechanism of its long life and of the seal, and the endgame it pursues are not established.
