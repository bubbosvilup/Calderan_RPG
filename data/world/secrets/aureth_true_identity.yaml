  aliases: []
  summary: >-
    Author-only world truth: Aureth, publicly the Sun Emperor, is the current incarnation of Light; he revealed
    himself in Year 0 and was sealed, not killed, by the First Voice in Year 491, in a pocket dimension.
  tags:
    - secret
    - world_truth
  search_context: Sealed world truth
  content: >-
    Tier 3 author-only world truth; no character knows it by default. Aureth is the current incarnation of Light, one
    of the six primordial forces; Light incarnates cyclically and Aureth is its present incarnation. Aureth is the
    figure publicly known as the Sun Emperor and is extremely powerful and functionally immortal, or
    extraordinarily long-lived, through this nature; the exact mechanism of that long life is not established. He is
    not the continent and not a dragon; no dragon exists in this canon, and any golden-dragon image attached to him
    is a false later invention. He did not create the world or the Four and is not the father of anyone's children. He existed before
    Year 0, and his activities before that year are deliberately obscure. In Year 0 he revealed himself publicly,
    which began the modern reckoning; Year 0 is not his birth. From then until Year 491 he was the sovereign of all of
    Helion, ruling a continent-wide empire in which local authorities were allowed. In Year 491 the First Voice, the
    current incarnation of Shadow, successfully sealed him; he was not killed or destroyed, because Shadow cannot
    safely erase Light. He is held in a pocket dimension, a space outside the ordinary geography of the world. Its
    appearance, physical rules, time flow, dimensions, entrance, access ritual, key, whether Aureth is conscious in it,
    and whether anyone can communicate with him are not established. Only the First Voice definitively knows how it is
    reached, and that method is not authored here. The public remembers only that the Sun Emperor disappeared in Year
    491, and his empire fragmented. Whether Light's incarnations keep memory, how they begin and end, and who his
    predecessors were are not established. Before 491 he sensed hostility, jealousy, predatory intent and imbalance in
    the incarnation of Shadow and encoded warnings in liturgy, prayer, canticle and symbolic language; he did not write
    that the First Voice is Shadow or that it would seal him. The Canticle of the Watchful Sun carries two readings.
    Its public reading is a devotional warning against darkness, pride, false voices and separation from the Light. Its
    deep reading is a genuine warning about the Shadow incarnation: the voice sweeter than the dawn is a counselor
    whose guidance leads the faithful from the Light, pride wearing humility is a patient ambition under a gentle
    face, and the kind dark that has a price is Shadow's manner of drawing the trusting. No line names anyone, and an
    ordinary priest cannot solve the conspiracy from it. The First Voice has never removed the Canticle because it is
    ambiguous, reinforces anti-Shadow doctrine and is too well known to erase without raising suspicion. Aureth is not
    the origin of Nicco's Light, and Nicco is not established as his reincarnation, heir, fragment or chosen.
