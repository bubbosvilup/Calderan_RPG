  search_context: Sealed world truth
  content: >-
    Tier 3 author-only world truth; no character knows it by default. The Church's missing divine founder, the Sun
    Emperor, and Aureth of the ancestral creation myth are the same being. Aureth is an ancient golden dragon, unique
    and extraordinary among dragons, able to assume human form, an exceptionally powerful Light mage and functionally
    immortal through Light; he is the true creator and shaper of this world. He had three draconic children associated
    with the three regions: the eldest, a male green dragon associated with West; a female red dragon associated with
    Center; and her twin brother, a male dragon associated with East whose colour, kind, sleeping place and nature are
    not established. All three entered a long hibernation after Aureth's disappearance; that correlation is canon, but
    its cause (dependency, command, grief, protection, pact, a consequence of his fate or anything else) is not. The
    children's names, ages, powers and awakening conditions are not established.
