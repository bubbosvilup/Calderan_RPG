  name: "Sealed Truth: Aureth, Incarnation of Light"
  display_name: "Sealed Truth: Aureth, Incarnation of Light"
  parent: null
  aliases: []
  summary: >-
    Author-only world truth: Aureth, publicly the Sun Emperor, is the current incarnation of Light; he revealed
    himself in Year 0 and was sealed, not killed, by the First Voice in Year 491.
  tags:
    - secret
    - world_truth
  search_context: Sealed world truth
  content: >-
    Tier 3 author-only world truth; no character knows it by default. Aureth is the current incarnation of Light, one
    of the six primordial forces; Light incarnates cyclically and Aureth is its present incarnation. Aureth is the
    figure publicly known as the Sun Emperor and is extremely powerful and functionally immortal, or
    extraordinarily long-lived, through this nature; the exact mechanism of that long life is not established. He is
    not the continent, not a golden dragon and not a primordial dragon: any golden-dragon image is myth or
    iconography. He did not create the world, the Four or dragons and is not the father of anyone's draconic
    children. He existed before Year 0, and his activities before that year are deliberately obscure. In Year 0 he
    revealed himself publicly, which began the modern reckoning; Year 0 is not his birth. In Year 491 the First Voice,
    the current incarnation of Shadow, successfully sealed him; he was not killed or destroyed, because Shadow cannot
    safely erase Light. The public remembers only that the Sun Emperor disappeared in Year 491. The ritual, the place,
    the artifact or mechanism of the seal, whether Aureth is conscious or can communicate, and whether the seal can be
    broken are not established. Whether Light's incarnations keep memory, how they begin and end, and who his
    predecessors were are not established. The warnings against Shadow that he left before 491 were genuine and
    specific.
