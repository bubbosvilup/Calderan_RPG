  summary: >-
    Author-only world truth: an unnamed ancient being of Shadow, Aureth's adversary, caused or enabled his
    disappearance and seeks to corrupt, dominate or destroy the created world.
  tags:
    - secret
    - world_truth
  search_context: Sealed world truth
  content: >-
    Tier 3 author-only world truth; no character knows it by default. Aureth has an ancient adversary connected to
    Shadow, able to assume a human form as Aureth can. Aureth did not vanish voluntarily: this adversary caused or
    enabled his disappearance, by a mechanism not yet established (capture, sealing, imprisonment, binding, draining or
    entrapment remain open). It opposes Aureth and his creation and seeks to corrupt, dominate, destroy or enslave the
    created world. The warnings against Shadow that Aureth left before disappearing, which the Church preserved as
    dogma, concerned this specific adversary. Its intended long-term method is less open destruction than corruption
    from within: division, manipulation, political conflict, war, exploitation, slavery, fanaticism, agents and cults,
    and institutional decay. It is not the hidden cause of every evil: the West-Center conflict, the slave trade,
    political corruption and crime exist and persist through ordinary mortal causes, and no current event is
    established as its work. Its name, kind, motive, prison, power source, agents and endgame are not established.
  knowledge:
