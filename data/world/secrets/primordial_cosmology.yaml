entity:
  id: primordial_cosmology
  type: world_lore
  name: "Sealed Truth: The Six Primordial Forces and the Four"
  display_name: "Sealed Truth: The Six Primordial Forces and the Four"
  parent: null
  aliases: []
  summary: >-
    Author-only world truth: the world is formed and sustained by six primordial forces, the four elemental forces
    (Earth, Fire, Water, Air), Light and Shadow; each incarnates cyclically; the Four are the current embodied child
    incarnations of the elements and lie dormant since the imbalance that followed Year 491.
  tags:
    - secret
    - world_truth
  search_context: Sealed world truth
  content: >-
    Tier 3 author-only world truth; no character knows it by default. The world was created and is sustained
    through the combined action of six primordial forces: four elemental forces, Earth, Fire, Water and Air, plus
    Light and Shadow. Light and Shadow are not good and evil; they are complementary foundational forces, and
    neither can fully exist without the other. After creation the forces did not vanish: they incarnate in living
    beings. The present incarnation of Light is Aureth and the present incarnation of Shadow is the First Voice. The
    four elemental forces are the same four categories as mortal elemental magic, and each is tied to one of Helion's
    four great divisions: West is Earth, Center is Fire, East is Water and the South Continent is Air. This is a
    cosmological mapping, not a cultural one; it says nothing about the character of any people. The Four are the
    current embodied child incarnations of Earth, Fire, Water and Air, conceptually parallel to Light incarnate in
    Aureth and Shadow incarnate in the First Voice; whether their incarnation works as Light's and Shadow's does is
    not inferred and is undefined. The Four have no established names, sexes, personalities, ages, species, origin
    stories, detailed powers or combat abilities. They are not dragons and have never been dragons; no dragon exists in
    this canon. They predate Aureth's public revelation, were not created by Aureth and are not his children. How
    incarnation works for any force, the interval, whether memory carries over, the trigger, whether incarnations are
    always human, what happens at natural death, whether incarnations can overlap and who earlier incarnations were,
    are all unknown. A mortal Light mage is not an incarnation of Light and a mortal Shadow mage is not an incarnation
    of Shadow; a mortal may have an affinity with, or access to, a fraction or expression of a force, and the same holds
    for the elements. When Aureth was sealed in Year 491 the active presence of Light in the world was greatly
    weakened, which unbalanced the six-force equilibrium. The elemental incarnations weakened progressively because one
    pillar of the balance was suppressed, and eventually entered dormancy; this was a gradual consequence of imbalance,
    not an instant event in 491, and no dormancy dates are established. They are alive but dormant, not dead, and no
    method of waking them is established. The Earth child lies dormant within, beneath or enclosed by the World Tree of
    Woodsong Forest, which is the objective identity of the sleeper in that tree; the Fire child lies beneath the deepest
    part of the Central Oasis, and the red reflections in the oasis water stay associated with it though the being is
    not red; the Water child lies dormant somewhere in the East and the Air child somewhere in the South Continent, and
    neither place is established. The same imbalance explains the slow fading of magic, especially elemental magic and
    Light, and the long, uneven worsening of the world: a dimmer and harsher feel, thinner soil, failed harvests,
    periodic famine, disease pressure, resource competition, political tension and more conflict. These are tendencies
    over centuries and in many regions, not a universal law, and healthy and beautiful places remain. Before Year 0 the
    continent was called Eldaven and is now called Helion; the Forgotten Era before Year 0 is restricted in part because
    its surviving records could reveal this cosmology.
