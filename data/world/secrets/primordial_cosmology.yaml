entity:
  id: primordial_cosmology
  type: world_lore
  name: "Sealed Truth: The Six Primordial Forces and the Four"
  display_name: "Sealed Truth: The Six Primordial Forces and the Four"
  parent: null
  aliases: []
  summary: >-
    Author-only world truth: the world is formed and sustained by six primordial forces, the four elemental forces,
    Light and Shadow; Light and Shadow incarnate cyclically; the Four are primordial elemental powers that predate
    Aureth and went dormant after he was sealed.
  tags:
    - secret
    - world_truth
  search_context: Sealed world truth
  content: >-
    Tier 3 author-only world truth; no character knows it by default. The world was created and is sustained
    through the combined action of six primordial forces: four elemental forces, Light and Shadow. Light and
    Shadow are not good and evil; they are complementary foundational forces, and neither can fully exist without
    the other. After creation they did not vanish: Light and Shadow incarnate cyclically in living beings. The
    present incarnation of Light is Aureth and the present incarnation of Shadow is the First Voice. How incarnation
    works is not established: the interval, whether memory carries over, the trigger, whether incarnations are
    always human or chosen, what happens at natural death, whether two incarnations can overlap, and who the earlier
    incarnations were are all unknown. The four elemental forces are not named in this record; which elements they are
    is an open design question. The Four are four primordial elemental powers corresponding to those four forces, and
    each is associated with one of Helion's four great divisions: West, Center, East and the South Continent. They
    predate Aureth's public revelation, were not created by Aureth and are not his children, and are not required to be
    dragons; any dragon image of them is myth or iconography. Their physical nature, names, forms, powers and
    elemental correspondences are not established. When Aureth was sealed in Year 491, the active presence of Light in
    the world was greatly weakened, which damaged the balance among Light, Shadow and the four elemental forces.
    The Four weakened progressively because one pillar of the balance was suppressed and eventually entered dormancy;
    this was a gradual consequence of imbalance, not an instant event in 491 and not filial loyalty, and no dormancy
    dates are established. The Four of West and Center are known to lie dormant, at the World Tree and beneath the
    Central Oasis respectively; the places of East's and South's are not established. Before Year 0 the continent was
    called Eldaven and is now called Helion; the Forgotten Era before Year 0 is restricted in part because its
    surviving records could reveal this cosmology.
