schema_version: 1
entity:
  id: world_tree_sleeper
  type: world_lore
  name: "Manual Secret: The Sleeper in the World Tree"
  display_name: "Manual Secret: The Sleeper in the World Tree"
  parent: null
  aliases: []
  summary: >-
    A living green dragon, the eldest of the three draconic children of the Aureth myth, lies in a deep sleep within
    the World Tree of Woodsong Forest, which protects and conceals him.
  tags:
    - secret
    - manual_secret
  search_context: Sealed manual secret
  content: >-
    Tier 2 manual secret. The green dragon of the West, eldest of the three draconic children and male, still exists.
    He lies in a deep sleep or hibernation within, beneath or mystically enclosed by the World Tree of Woodsong
    Forest; the exact physical arrangement is not established. The World Tree's role is to protect and conceal the
    sleeping dragon. Why he sleeps, how long he has slept, whether he can be woken and what he would do are not
    established. No character knows this by default: holders are assigned only by explicit authoring of known_by,
    and being a Woodsinger, elder or clan leader does not by itself confer this knowledge.
  knowledge:
    visibility:
      narrator: false
      player: false
    known_by: []
    secrecy: holder_only
  category: cultures
  related_entities:
    - world_tree
    - calderan_northern_forest
    - aureth_creation_myth
