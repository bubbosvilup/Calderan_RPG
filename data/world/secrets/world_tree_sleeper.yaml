  type: world_lore
  name: "Manual Secret: The Sleeper in the World Tree"
  display_name: "Manual Secret: The Sleeper in the World Tree"
  parent: null
  aliases: []
  summary: >-
    One of the Four, the primordial elemental power associated with West, lies dormant within the World Tree of
    Woodsong Forest, which protects and conceals it.
  tags:
    - secret
    - manual_secret
  search_context: Sealed manual secret
  content: >-
    Tier 2 manual secret. The primordial elemental power associated with West, one of the Four, still exists. It
    lies dormant within, beneath or mystically enclosed by the World Tree of Woodsong Forest; the exact physical
    arrangement is not established. The World Tree's role is to protect and conceal it. Its form, kind and sex, how
    long it has been dormant, whether it can be woken and what it would do are not established. No character knows this
    by default: holders are assigned only by explicit authoring of known_by, and being a Woodsinger, elder or clan
    leader does not by itself confer this knowledge.
  knowledge:
    visibility:
      narrator: false
      player: false
    known_by: []
    secrecy: holder_only
  category: cultures
  related_entities:
