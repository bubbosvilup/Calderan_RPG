schema_version: 1
entity:
  id: oasis_sleeper
  type: world_lore
  name: "Manual Secret: The Sleeper Beneath the Oasis"
  display_name: "Manual Secret: The Sleeper Beneath the Oasis"
  parent: null
  aliases: []
  summary: >-
    A living red dragon, the female draconic child of Center in the Aureth myth, lies in a deep sleep beneath the
    deepest part of the Central Oasis; her dormant presence and magic cause the red reflections in its water.
  tags:
    - secret
    - manual_secret
  search_context: Sealed manual secret
  content: >-
    Tier 2 manual secret. The red dragon of Center, female, still exists. She lies in a deep sleep or hibernation
    beneath the deepest part of the Central Oasis; the exact physical arrangement is not established. Her dormant
    presence and magic cause the unusual red reflections and glints in the oasis water. Why she sleeps, how long she
    has slept, whether she can be woken and what she would do are not established. No character knows this by
    default: holders are assigned only by explicit authoring of known_by, and living at the oasis does not by itself
    confer this knowledge.
  knowledge:
    visibility:
      narrator: false
      player: false
    known_by: []
    secrecy: holder_only
  category: cultures
  related_entities:
    - central_oasis_settlement
    - aureth_creation_myth
chunks: []
