  name: "Manual Secret: The Sleeper Beneath the Oasis"
  display_name: "Manual Secret: The Sleeper Beneath the Oasis"
  parent: null
  aliases: []
  summary: >-
    One of the Four, the primordial elemental power associated with Center, lies dormant beneath the deepest part of
    the Central Oasis; its dormant presence causes the red reflections in the oasis water.
  tags:
    - secret
    - manual_secret
  search_context: Sealed manual secret
  content: >-
    Tier 2 manual secret. The primordial elemental power associated with Center, one of the Four, still exists. It
    lies dormant beneath the deepest part of the Central Oasis; the exact physical arrangement is not established. Its
    dormant presence causes the unusual red reflections and glints in the oasis water. Its form, kind and sex, how long
    it has been dormant, whether it can be woken and what it would do are not established. No character knows this by
    default: holders are assigned only by explicit authoring of known_by, and living at the oasis does not by itself
    confer this knowledge.
