schema_version: 1
entity:
  id: oasis_sleeper
  type: world_lore
  name: "Manual Secret: The Sleeper Beneath the Oasis"
  display_name: "Manual Secret: The Sleeper Beneath the Oasis"
  parent: null
  aliases: []
  summary: >-
    The Fire child, the embodied elemental incarnation associated with Center and one of the Four, lies dormant
    beneath the deepest part of the Central Oasis; its dormant presence is associated with the red reflections in
    the oasis water.
  tags:
    - secret
    - manual_secret
  search_context: Sealed manual secret
  content: >-
    Tier 2 manual secret. The Fire child, the current embodied elemental incarnation associated with Center and one
    of the Four, still exists. It lies dormant beneath the deepest part of the Central Oasis; the exact physical
    arrangement is not established. Its dormant presence stays associated with the unusual red reflections and
    glints in the oasis water, but the being itself is not red. Its name, form and sex, how long it has been
    dormant, whether it can be woken and what it would do are not established. No character knows this by
    default: holders are assigned only by explicit authoring of known_by, and living at the oasis does not by itself
    confer this knowledge.
  knowledge:
    visibility:
      narrator: false
      player: false
    known_by: []
    secrecy: holder_only
  category: cultures
  related_entities:
    - central_oasis_settlement
    - the_four
    - aureth_creation_myth
