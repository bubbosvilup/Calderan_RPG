  summary: >-
    Author-only world truth: the operational concealment of the First Voice, its communication with the Church
    leadership and its hidden agents. Never to be read in play.
  tags:
    - secret
    - world_truth
  search_context: Sealed world truth
  content: >-
    Tier 3 author-only world truth; never read in play. The First Voice has no single fixed public identity. It keeps
    to ordinary, unremarkable lay or low-ranking records posts inside the Church's central record-keeping, never
    to a visible leadership office, and it retires each identity after a few decades by a staged death that the
    Church's own mandatory-cremation law makes impossible to examine, then takes a new place with new papers that
    its control of the records makes unquestionable. It lives away from Calderan and away from every campaign
    location, in a place that is deliberately not established. Succession of the visible High Archon is real and
    ordinary; the First Voice does not choose a High Archon, but it shapes the pool of candidates through
    promotions, postings, patronage and the dossiers kept in the records it tends, so that the person who rises is one
    whose conscience and ambition it has already measured. It speaks to the High Archon through sealed written
    counsel, carried by couriers who do not know what they carry and passed through the records service; the High
    Archon answers in writing the same way. They have never met. The present High Archon, Cassian Valerius,
    believes the counsel comes from a Keeper of the Founder's Testament, an ancient anonymous office that the Sun
    Emperor himself created to guard his will, held by a succession of unknown custodians; he does not know that it
    is one being, that it is Shadow or that Aureth was sealed by it. The counsel is written in the Founder's own
    liturgical language and cites his genuine warnings, which is why Cassian trusts it. Orders enter the visible
    hierarchy as counsel to the High Archon, as procedural directives issued through the Auditors' records, and
    through a small number of agents placed in Church and Inquisition archives. The First Voice has few such agents
    and no army; it works through institutions, doctrine and patience. Its hidden agents are described in the
    sealed truth on the hidden persecution.
