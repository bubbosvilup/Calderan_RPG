schema_version: 1
entity:
  id: beastfolk_origin
  type: world_lore
  name: "Sealed Truth: The Origin of the Beastfolk"
  display_name: "Sealed Truth: The Origin of the Beastfolk"
  parent: null
  aliases: []
  summary: >-
    Author-only world truth: the Beastfolk were created by the Fire elemental power; this is why they cannot use
    magic and why they resist hostile magic.
  tags:
    - secret
    - world_truth
  search_context: Sealed world truth
  content: >-
    Tier 3 author-only world truth; no character knows it by default. The Beastfolk were created by the Fire
    elemental incarnation or power. They were not created by a dragon, by Aureth, by Light or by Shadow, and no
    ritual or date is established. They cannot channel magic because they were made through Fire rather than through
    the ordinary Light- and Shadow-linked structure of magical mortal life. The same difference gives them an
    unusual resistance: they are immune to ordinary offensive magic and to Shadow-based mental confusion or
    corruption. They are not immune to every supernatural phenomenon, to indirect physical consequences of a spell
    such as a collapsing wall, to environmental hazards, or to beneficial magic. Public knowledge holds only a no-magic rule and a common belief
    in some resistance; the cosmological reason and the exact relationship to Shadow are known to no one.
  knowledge:
    visibility:
      narrator: false
      player: false
    known_by: []
    secrecy: author_only
  category: races
  related_entities:
