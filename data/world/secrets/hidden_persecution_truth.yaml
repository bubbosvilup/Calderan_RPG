  name: "Sealed Truth: Why Magic Is Persecuted"
  display_name: "Sealed Truth: Why Magic Is Persecuted"
  parent: null
  aliases: []
  summary: >-
    Author-only world truth: the real reasons the Church persecutes Light and Shadow users, and the small hidden
    cadre of diverted Shadow users. Never to be read in play.
  tags:
    - secret
    - world_truth
  search_context: Sealed world truth
  content: >-
    Tier 3 author-only world truth; never read in play. The Church's public doctrine on mortal Light, that it is
    a sacrilege against the Sun Emperor's unique Light, is sincerely held by nearly everyone who teaches it. The real
    reason the hidden structure under the First Voice treats mortal Light mages as the true high-priority threat is that
    uncontrolled Light threatens Shadow's dominance and has unpredictable links to the weakened force. When the
    Church discovers a Light mage, the aim is capture, investigation, condemnation and execution, and survival after
    confirmed discovery is extremely unlikely; no universal mechanical process exists, and whether a given case
    unfolds this way depends on who finds the mage and when. Shadow mages are persecuted publicly in earnest: hunted,
    imprisoned, interrogated, tortured and condemned as heretics. In secret, promising or unusually powerful Shadow
    users are sometimes diverted from that fate to the First Voice as disciples and agents. They form a small hidden
    cadre, not an army, called the Unlit Choir, and most Shadow users still suffer ordinary persecution. Diversion
    happens through agents in Inquisition archives who mark an unusual prisoner for quiet transfer; no one in the
    visible hierarchy, High Inquisitor included, knows of it. Since the sealing, Shadow has comparatively greater
    influence in the world, so Shadow manifestations are somewhat more common than Light, while Light remains
    dramatically rarer. Nicco's Light does not automatically summon any of this, and no rule here forces the
    Church to find him.
