  summary: >-
    Humans are the predominant population in West.
  tags: ["races"]
  search_context: ""
  content: >-
    Human social institutions dominate much of West's political structure. Human peoples and
    cultures vary across Helion; for example, the desert oasis settlement in Center is the
    homeland of a distinct people with a mounted martial tradition. In Beastfolk-led Center, humans
    are disproportionately used as foreign-facing merchants and intermediaries, a social tendency
    rather than a rule. No universal human racial
    abilities or statistics are established.
