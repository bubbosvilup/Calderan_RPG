  summary: >-
    Dwarves are a familiar established people with strong cultural associations with skilled
    material work.
  tags: ["races"]
  search_context: ""
  content: >-
    Craftsmanship, construction, technical trades, and skilled material work are cultural
    patterns, not biological absolutes. Not every dwarf is an artisan. Their ancestral
    homeland is the Dragon's Teeth Mountains; many have since dispersed into cities across
    West, Center and East, where their metalwork and craft are in demand. No racial stat
    bonuses or unified dwarf nation are established.
