  name: "West Governance"
  display_name: "West Governance"
  parent: null
  aliases: []
  summary: >-
    West is a realm ruled by the Sun Emperor, its divine and functionally immortal sovereign, with
    Dukes governing major cities and their surrounding territories in his name.
  tags: ["fundamentals"]
  search_context: "Sun Emperor, sovereign of West, Crown, Dukes, ducal councils, guilds, Church"
  content: >-
    The Sun Emperor is the reigning sovereign of West and the supreme source of legitimacy. Church
    doctrine holds him to be a divine and immortal sovereign; he is functionally immortal. He does
    not reside in Calderan, and his residence is undefined. "The Crown" refers to his sovereign
    authority; no royal family, succession law or named heir is established. Each Duke is the
    primary temporal authority of a major city and its territory beneath the Sun Emperor, supported
    by a local council; Calderan's council has a fixed nine-seat form, while other cities' councils
    remain undefined. Such councils may include local nobles, representatives of the three national
    guilds, and ecclesiastical representation. Local nobles exist without a standardized tier
    taxonomy. The four major institutional power blocs are the Merchants Guild, Artisans Guild,
    Learned Arts Guild, and the Church of the Sun Emperor. The first three are national guilds; the
    Church is not a guild but has comparable or greater political weight. Temporal and spiritual
    authority are separate: Dukes govern civic matters, while the Church's High Archon of the West
    holds spiritual authority, and neither simply outranks the other. Guilds may maintain city
    branches and local representatives, who collectively determine or select a national
    representative; selection methods and terms remain undefined. For major realm-wide matters
    Dukes, guild national representatives and national Church representation may be summoned or
    consulted in the sovereign's name. No constitution is fixed.
