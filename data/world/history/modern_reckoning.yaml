  name: The Modern Reckoning
  display_name: The Modern Reckoning
  parent: null
  aliases: ["Year 0", "Reckoning of years", "the current year"]
  summary: >-
    The modern reckoning of years begins at Year 0, when the Sun Emperor Aureth revealed himself to
    the world; he disappeared in Year 491, and the present year is 1191, the seven-hundredth
    anniversary of the disappearance.
  tags: ["history", "chronology"]
  search_context: "Year 0, the modern reckoning, current year 1191, year 491, disappearance of the Sun Emperor, seven hundredth anniversary, Aureth reveals himself, dating of years, history of the Sun Emperor."
  content: >-
    The modern reckoning of years begins at Year 0, when Aureth, the Sun Emperor, revealed himself
    publicly to the world. Year 0 marks that revelation; it is not presented as his birth, and what he
    was or did before it is not part of ordinary public knowledge. In Year 491 the Sun Emperor
    disappeared; the Church does not teach that he died. The present year is 1191, so the current
    year is the seven-hundredth anniversary of the disappearance, a date of religious and political
    weight that the Church recognizes and that the Church and the realm mark through the
    centennial observances. Everything before Year 0 is commonly called the Forgotten Era. Every hundredth year after the
    disappearance is marked across the continent with the Great Illumination, and the seven-hundredth is held to be
    exceptionally significant. An ordinary year has twelve months of thirty days plus five intercalary days, 365 in
    all; every fourth year is a leap year with six, 366 in all, and the year 1191 is a leap year. The months, week and
    festivals are described in the calendar records; the Great Illumination is an elevated form of the Suns, not a separate day.
